<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Armen Atölye Paneli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: uygulama kabuğu — solda koyu mürekkep kenar çubuğu, sağda kumaş-açık çalışma alanı; telefonda üst bar + alt sekme */
:root{
  --bg:#F3F2F4; --surface:#FFFFFF; --surface-2:#F8F7F9; --line:#E2DFE5; --ink:#1A1622; --muted:#6C6577;
  --accent:#7B1E3A; --accent-ink:#FFFFFF; --accent-soft:#F4E4E9;
  --side:#1A1622; --side-ink:#E9E4EE; --side-muted:#968EA3; --side-hi:#2B2536;
  --ok:#1D7A55; --ok-soft:#DFF2E9; --warn:#A86200; --warn-soft:#FBEBD3; --bad:#B42318; --bad-soft:#FBE3E0; --info:#2C5BB8; --info-soft:#E2EAFA;
  --garment-line:#CFCAD6;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(26,22,34,.06),0 8px 24px rgba(26,22,34,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141118; --surface:#1D1923; --surface-2:#231E2A; --line:#332C3C; --ink:#EEEAF2; --muted:#A29AAE;
  --accent:#E07A98; --accent-ink:#1A0E13; --accent-soft:#3A1F2A;
  --side:#0E0C11; --side-ink:#E9E4EE; --side-muted:#8E869B; --side-hi:#221D29;
  --ok:#5BD3A1; --ok-soft:#173327; --warn:#F2B35B; --warn-soft:#3A2A12; --bad:#FF8A7E; --bad-soft:#3D1C19; --info:#8EB2FF; --info-soft:#1C2740;
  --garment-line:#4A4255; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141118; --surface:#1D1923; --surface-2:#231E2A; --line:#332C3C; --ink:#EEEAF2; --muted:#A29AAE;
  --accent:#E07A98; --accent-ink:#1A0E13; --accent-soft:#3A1F2A;
  --side:#0E0C11; --side-ink:#E9E4EE; --side-muted:#8E869B; --side-hi:#221D29;
  --ok:#5BD3A1; --ok-soft:#173327; --warn:#F2B35B; --warn-soft:#3A2A12; --bad:#FF8A7E; --bad-soft:#3D1C19; --info:#8EB2FF; --info-soft:#1C2740;
  --garment-line:#4A4255; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(24px,3vw,32px);font-weight:800}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Kabuk */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 20px var(--f-display)}
.brand b{font:800 22px/1 var(--f-display);letter-spacing:.06em}
.brand small{display:block;font:500 11px var(--f-mono);color:var(--side-muted);letter-spacing:.1em;margin-top:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-muted);text-decoration:none;font-weight:600}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{color:var(--side-ink);background:var(--side-hi)}
.nav a.on{color:var(--side-ink);background:var(--side-hi)}
.nav a .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font:700 11px var(--f-mono);border-radius:99px;padding:2px 7px}
.nav-sep{font:600 10px var(--f-mono);letter-spacing:.14em;color:var(--side-muted);padding:18px 12px 6px;text-transform:uppercase}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:12px;border-top:1px solid var(--side-hi);display:grid;gap:8px}
.side-foot button{background:none;border:1px solid var(--side-hi);color:var(--side-ink);border-radius:8px;padding:7px 10px;font-size:12px;text-align:left}

.main{min-width:0;padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.topbar .sub{color:var(--muted);margin-top:4px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--f-mono);letter-spacing:.08em;color:var(--warn);background:var(--warn-soft);padding:5px 10px;border-radius:99px;text-transform:uppercase}

/* Bileşenler */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-b{padding:16px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:700;border:1px solid var(--line);background:var(--surface);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);padding:5px 9px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-yeni{color:var(--info);background:var(--info-soft)}
.st-baskida{color:var(--warn);background:var(--warn-soft)}
.st-kalite{color:var(--accent);background:var(--accent-soft)}
.st-hazir{color:var(--ok);background:var(--ok-soft)}
.st-teslim{color:var(--muted);background:var(--surface-2)}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--garment-line);vertical-align:-2px;flex:none}

.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi .v{font:700 30px/1.1 var(--f-display);margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:13px;color:var(--muted);margin-top:4px}
.kpi.alert .v{color:var(--bad)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.sz{text-align:center;width:64px}
.sz input{width:52px;text-align:center;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 2px;font:500 14px var(--f-mono)}
.sz input:hover{border-color:var(--line)}
.sz input:focus{border-color:var(--accent);background:var(--surface)}
.sz.low input{color:var(--bad);background:var(--bad-soft);font-weight:600}
.sz.zero input{color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.meter{height:6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;width:110px}
.meter i{display:block;height:100%}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:6px}
.field label,.lbl{font:600 12px var(--f-body);color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
textarea.input{resize:vertical;min-height:72px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-weight:600;font-size:14px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.row{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.sizes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sizes .s{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:var(--surface)}
.sizes .s b{display:block;font:700 13px var(--f-mono)}
.sizes .s input{width:100%;text-align:center;border:0;background:var(--surface-2);border-radius:7px;padding:6px 0;margin:6px 0 4px;font:600 15px var(--f-mono)}
.sizes .s small{font:500 11px var(--f-mono);color:var(--muted)}
.sizes .s.over{border-color:var(--bad);background:var(--bad-soft)}
.sizes .s.over small{color:var(--bad)}

.order-layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.preview{position:sticky;top:20px}
.garment-stage{background:var(--surface-2);border-radius:10px;display:grid;place-items:center;padding:12px;position:relative}
.garment-stage svg{width:100%;max-width:320px;height:auto}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-weight:600;text-align:right}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;background:var(--surface-2)}
.drop.has{border-style:solid;border-color:var(--ok)}
.drop img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:var(--surface)}
.section-t{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.section-t .n{font:600 12px var(--f-mono);color:var(--accent)}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.notice{border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}

/* Atölye kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0;display:flex;flex-direction:column;gap:10px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px}
.col-h .c{font:600 12px var(--f-mono);color:var(--muted)}
.job{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;box-shadow:var(--shadow)}
.job.fresh{border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
.job-top{display:flex;gap:10px}
.job-thumb{width:64px;height:72px;flex:none;background:var(--surface-2);border-radius:8px;display:grid;place-items:center}
.job-thumb svg{width:58px;height:66px}
.job .id{font:600 12px var(--f-mono);color:var(--accent)}
.job .t{font-weight:700;line-height:1.3}
.job .m{font-size:12.5px;color:var(--muted)}
.job-acts{display:flex;gap:6px}
.job-acts .btn{flex:1}
.due{font:500 12px var(--f-mono)}
.due.late{color:var(--bad)}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:18px 8px;border:1.5px dashed var(--line);border-radius:10px}

/* Çekmece */
.scrim{position:fixed;inset:0;background:rgba(10,8,14,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2);
  padding-block:calc(22px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:36px;height:36px;font-size:18px;line-height:1}
.timeline{display:grid;gap:0;margin-top:6px}
.tl{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tl::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700}
.tl.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tl.cur .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl small{display:block;color:var(--muted);font-size:12px}

.toast{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-weight:600;box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 32px));display:flex;gap:10px;align-items:center;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}}

.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{width:100%;max-width:34px;background:var(--accent-soft);border-radius:6px 6px 2px 2px;border:1px solid var(--accent);border-bottom:0;display:block}
.bars .b.today i{background:var(--accent)}
.bars .b span{font:500 11px var(--f-mono);color:var(--muted)}
.bars .b em{font:600 12px var(--f-mono);font-style:normal}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pipe a{text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.pipe a b{display:block;font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.workshop-mode .side{background:#0B1F1A}
.mode-switch{display:flex;background:var(--side-hi);border-radius:10px;padding:3px;margin:0 4px 14px}
.mode-switch button{flex:1;border:0;background:transparent;color:var(--side-muted);border-radius:8px;padding:7px 6px;font-weight:700;font-size:12.5px}
.mode-switch button.on{background:var(--side-ink);color:var(--side)}
.mob-nav{display:none}

@media (max-width:1100px){
  .order-layout{grid-template-columns:minmax(0,1fr)}
  .preview{position:static}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;z-index:20;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  .brand{padding:0}
  .brand small,.nav,.nav-sep,.side-foot{display:none}
  .mode-switch{margin:0 0 0 auto;min-width:0}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:minmax(0,1fr)}
  .mob-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .mob-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;position:relative}
  .mob-nav a svg{width:20px;height:20px}
  .mob-nav a.on{color:var(--accent)}
  .mob-nav a .badge{position:absolute;top:4px;left:55%;background:var(--accent);color:var(--accent-ink);font:700 10px var(--f-mono);border-radius:99px;padding:1px 5px}
  .sizes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .kanban{grid-template-columns:minmax(0,1fr);overflow:visible}
  .topbar .btn{padding:9px 13px}
  .filters{width:100%}
  .filters .input{width:100%!important}
  table.cards,table.cards tbody{display:block}
  table.cards thead{display:none}
  table.cards tr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 8px;padding:14px 16px;border-bottom:1px solid var(--line)}
  table.cards tr:last-child{border-bottom:0}
  table.cards td{display:block;padding:0;border:0;min-width:0;width:auto}
  table.cards td[data-label]::before{content:attr(data-label);display:block;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  table.cards .c-full{grid-column:1/-1}
  table.cards .c-3{grid-column:span 3}
  table.cards .c-2{grid-column:span 2}
  table.cards .sz{text-align:center}
  table.cards .sz input{width:100%;background:var(--surface-2)}
  table.cards .meter{width:100%;margin-top:8px}
  table.orders tr{grid-template-columns:minmax(0,1fr) auto}
  table.orders .o-id{grid-column:1;grid-row:1}
  table.orders .o-st{grid-column:2;grid-row:1;justify-self:end}
  table.orders td{white-space:normal!important}
  .drawer .spec{font-size:13.5px}
  .kpi .v{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div class="app" id="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">A</div><div><b>ARMEN</b><small>STOK · SİPARİŞ · ATÖLYE</small></div></div>
    <div class="mode-switch" role="tablist" aria-label="Görünüm">
      <button id="mode-store" class="on" type="button">Mağaza</button>
      <button id="mode-shop" type="button">Atölye</button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div>Prototip sürüm · örnek verilerle çalışır. Değişiklikler yalnızca bu tarayıcıda saklanır.</div>
      <button id="reset" type="button">↺ Demo verisini sıfırla</button>
    </div>
  </aside>
  <main class="main" id="view"></main>
  <nav class="mob-nav" id="mobnav"></nav>
</div>
<div id="layer"></div>

<script>
(function(){
"use strict";
// ---------------- Sabitler ----------------
const TODAY = new Date(2026,10,2);
const SIZES = ["S","M","L","XL","XXL"];
const STATUS = {
  yeni:   {t:"Atölyeye iletildi", short:"Yeni"},

// Giysi çizimi (ön/arka) + baskı yerleşimi
function garment(p,design,side,opts={}){
  const hex=p?p.hex:"#F7F6F2", cat=p?p.cat:"tisort";
  const dark=isDark(hex);
  const body= cat==="hoodie"||cat==="sweat"
   ? "M118 28 L58 56 L18 210 L60 222 L92 120 L92 380 L268 380 L268 120 L300 222 L342 210 L302 56 L242 28 Q180 62 118 28 Z"
   : "M118 26 L60 52 L20 122 L70 146 L92 116 L92 380 L268 380 L268 116 L290 146 L340 122 L300 52 L242 26 Q180 64 118 26 Z";
  let extra="";
  const stroke = dark ? "rgba(255,255,255,.18)" : "rgba(0,0,0,.16)";
  if(cat==="hoodie"){
    extra = side==="on"
      ? `<path d="M128 30 Q180 110 232 30 Q214 4 180 2 Q146 4 128 30Z" fill="${hex}" stroke="${stroke}" stroke-width="2"/><path d="M168 66 L166 120 M192 66 L194 120" stroke="${stroke}" stroke-width="2"/><path d="M128 300 L232 300 L240 360 L120 360Z" fill="none" stroke="${stroke}" stroke-width="2"/>`
      : `<path d="M124 32 Q180 -18 236 32 Q236 70 180 84 Q124 70 124 32Z" fill="${hex}" stroke="${stroke}" stroke-width="2"/>`;
  } else if(cat==="polo"){
    extra = side==="on" ? `<path d="M150 34 L180 70 L210 34" fill="none" stroke="${stroke}" stroke-width="3"/><path d="M180 70 L180 120" stroke="${stroke}" stroke-width="2"/><circle cx="180" cy="86" r="2.5" fill="${stroke}"/><circle cx="180" cy="104" r="2.5" fill="${stroke}"/>` : "";
  } else {
    extra = side==="on" ? `<path d="M118 26 Q180 72 242 26" fill="none" stroke="${stroke}" stroke-width="5"/>` : `<path d="M126 30 Q180 46 234 30" fill="none" stroke="${stroke}" stroke-width="4"/>`;
  }
  let art="";
  if(design && PLACES[design.place] && PLACES[design.place].side===side){
    const pl=PLACES[design.place]; const w=Math.max(16,Math.min(pl.max,+design.cm||8))*PX_PER_CM;
    const x=pl.x-w/2, y=pl.y-w/2;
    if(design.kind==="yazi"){
      const txt=design.text||"YAZI";
      const fs=Math.min(w/Math.max(2,txt.length)*1.7,w*.55);
      art=`<text x="${pl.x}" y="${pl.y}" text-anchor="middle" dominant-baseline="middle" font-family="Bricolage Grotesque, Figtree, sans-serif" font-weight="800" font-size="${fs.toFixed(1)}" fill="${design.ink||"#111"}" letter-spacing="1">${esc(txt)}</text>`;
    } else if(design.file){
      art=`<image href="${design.file}" x="${x}" y="${y}" width="${w}" height="${w}" preserveAspectRatio="xMidYMid meet"/>`;
    } else {
      art=sampleMark(design,pl.x,pl.y,w);
    }
    if(opts.guide){
      art+=`<rect x="${x-4}" y="${y-4}" width="${w+8}" height="${w+8}" rx="4" fill="none" stroke="#E0457B" stroke-width="1.5" stroke-dasharray="5 4"/>`+
           `<text x="${pl.x}" y="${y+w+18}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#E0457B">${(+design.cm||0)} cm</text>`;
    }
  }
  return `<svg viewBox="0 0 360 400" role="img" aria-label="${esc((p?p.name+" "+p.color:"Ürün")+" — "+(side==="on"?"ön":"arka"))}">
    <path d="${body}" fill="${hex}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>${extra}${art}</svg>`;
}
function sampleMark(d,cx,cy,w){
  const r=w/2, ink=d.ink||"#1F2B4D", initial=esc((d.text||"A").trim().charAt(0).toUpperCase());
  if(d.kind==="desen"){
    let s=`<g><rect x="${cx-r}" y="${cy-r}" width="${w}" height="${w}" rx="${w*.12}" fill="${ink}"/>`;
    for(let i=0;i<4;i++) s+=`<circle cx="${cx}" cy="${cy}" r="${r*(.25+i*.18)}" fill="none" stroke="#F3D27A" stroke-width="${Math.max(1,w*.025)}"/>`;
    return s+`<text x="${cx}" y="${cy+r*.8}" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="${w*.16}" fill="#F7F6F2">${esc(d.text||"")}</text></g>`;
  }
  return `<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="${ink}"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="${w*.5}" fill="#F7F6F2">${initial}</text></g>`;
}
function isDark(hex){const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000<110}

    const list=S.products.filter(p=>(filter.cat==="all"||p.cat===filter.cat)&&(!q||(p.name+" "+p.color).toLocaleLowerCase("tr").includes(q))&&(!filter.low||SIZES.some(z=>p.stock[z]<=Math.ceil(p.min/2))));

      return `<tr><td class="c-3"><b>${esc(p.name)}</b></td><td class="c-2" style="white-space:nowrap"><span class="swatch" style="background:${p.hex}"></span> ${esc(p.color)}</td>
      ${SIZES.map(z=>{const n=p.stock[z];const c=n===0?"zero":n<=Math.ceil(p.min/2)?"low":"";return `<td class="sz ${c}" data-label="${z}"><input id="st-${p.id}-${z}" type="number" min="0" inputmode="numeric" value="${n}" data-p="${p.id}" data-z="${z}" aria-label="${esc(p.name+" "+p.color+" "+z)}"></td>`}).join("")}
      <td class="mono c-2" data-label="Toplam"><b>${t}</b></td><td data-label="Doluluk"><div class="meter"><i style="width:${pct*100}%;background:${pct<.25?"var(--bad)":pct<.5?"var(--warn)":"var(--ok)"}"></i></div></td><td class="mono c-2" data-label="Fiyat">${fmtTL(p.price)}</td></tr>`}).join("")
      :`<tr><td colspan="10" class="c-full"><div class="empty">Filtreye uyan ürün yok.</div></td></tr>`;
    body.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{
      const p=prod(inp.dataset.p);p.stock[inp.dataset.z]=Math.max(0,parseInt(inp.value)||0);save();rows();renderNav();
      toast(`✓ ${esc(p.name)} ${esc(p.color)} ${inp.dataset.z}: <span class="mono">${p.stock[inp.dataset.z]}</span> adet olarak güncellendi`);
    });
  }
  rows();
  $("#q").oninput=e=>{filter.q=e.target.value;rows()};
  $("#lowonly").onchange=e=>{filter.low=e.target.checked;rows()};
  $("#cats").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter.cat=b.dataset.cat;$("#cats").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));rows()});
  $("#add-prod").onclick=openAddProduct;
}

    go("siparisler"); setTimeout(()=>openOrder(id),150);
  };

function advance(id){
  const o=S.orders.find(x=>x.id===id); const i=FLOW.indexOf(o.status); if(i>=FLOW.length-1) return;
  o.status=FLOW[i+1]; o.history.push([o.status,nowStamp()]); if(!S.seen.includes(id)) S.seen.push(id); save();
  toast(`✓ <span><b class="mono">${id}</b> → ${STATUS[o.status].t}. Mağaza bilgilendirildi.</span>`);
  const L=$("#layer"); if(L.innerHTML) openOrder(id);
  render();
}

        ${o.phone?`<dt>Telefon</dt><dd class="mono">${esc(o.phone)}</dd>`:""}
        <dt>Ürün</dt><dd>${esc(p.name)} · <span class="swatch" style="background:${p.hex}"></span> ${esc(p.color)}</dd>
        <dt>Beden / adet</dt><dd class="mono">${qtyText(o.qty)} = ${total(o.qty)}</dd>
        <dt>Baskı türü</dt><dd>${KINDS[o.design.kind]}${o.design.kind==="yazi"?` · “${esc(o.design.text)}”`:""}</dd>
        <dt>Konum</dt><dd>${pl.t} · ${o.design.cm} cm genişlik</dd>
        <dt>Teknik</dt><dd>${esc(o.design.tech)}</dd>
        <dt>Baskı rengi</dt><dd class="mono"><span class="swatch" style="background:${o.design.ink}"></span> ${o.design.ink.toUpperCase()}</dd>
        ${o.design.fileName?`<dt>Dosya</dt><dd class="mono">📎 ${esc(o.design.fileName)}</dd>`:""}
        <dt>Teslim</dt><dd>${fmtDate(o.due)} 2026</dd>
      </dl>
      ${o.note?`<div class="notice" style="margin-top:14px;background:var(--warn-soft);color:var(--warn)">Not: ${esc(o.note)}</div>`:""}</div></div>
      <div><h3 style="margin-bottom:10px">Süreç</h3><div class="timeline">${FLOW.map((s,i)=>`<div class="tl ${i<cur||o.status==="teslim"?"done":i===cur?"cur":""}"><div class="dot">${i<cur||o.status==="teslim"?"✓":""}</div><div><b>${STATUS[s].t}</b><small>${histMap[s]||"Bekliyor"}</small></div></div>`).join("")}</div></div>
      ${shop&&o.status!=="teslim"?`<button class="btn primary" type="button" id="adv">${o.status==="hazir"?"Teslim edildi olarak işaretle":"Durumu ilerlet → "+STATUS[FLOW[cur+1]].t}</button>`:""}
    </div></aside>`;
  const close=()=>L.innerHTML="";
  $("#scrim").onclick=close;$("#cls").onclick=close;
  const a=$("#adv"); if(a) a.onclick=()=>advance(id);
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",k)}});
}

function setMode(m){ mode=m; $("#layer").innerHTML=""; if(m==="shop") location.hash="atolye"; else { if(location.hash==="#atolye") render(); else location.hash="panel" } render() }

$("#mode-store").onclick=()=>setMode("store");
$("#mode-shop").onclick=()=>setMode("shop");
$("#reset").onclick=e=>{
  const b=e.currentTarget;
  if(b.dataset.armed){ S=seed(); draft=null; save(); b.textContent="↺ Demo verisini sıfırla"; delete b.dataset.armed; render(); toast("Demo verisi sıfırlandı."); return }
  b.dataset.armed="1"; b.textContent="Emin misiniz? Tekrar tıklayın"; setTimeout(()=>{ if(b.dataset.armed){delete b.dataset.armed;b.textContent="↺ Demo verisini sıfırla"}},3000);
};
window.addEventListener("hashchange",()=>{ $("#layer").innerHTML=""; render() });
render();
})();
</script>
</body></html>
