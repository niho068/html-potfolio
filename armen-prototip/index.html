<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Armen Atölye Paneli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: uygulama kabuğu — solda koyu mürekkep kenar çubuğu, sağda kumaş-açık çalışma alanı; telefonda üst bar + alt sekme */
:root{
  --bg:#F3F2F4; --surface:#FFFFFF; --surface-2:#F8F7F9; --line:#E2DFE5; --ink:#1A1622; --muted:#6C6577;
  --accent:#7B1E3A; --accent-ink:#FFFFFF; --accent-soft:#F4E4E9;
  --side:#1A1622; --side-ink:#E9E4EE; --side-muted:#968EA3; --side-hi:#2B2536;
  --ok:#1D7A55; --ok-soft:#DFF2E9; --warn:#A86200; --warn-soft:#FBEBD3; --bad:#B42318; --bad-soft:#FBE3E0; --info:#2C5BB8; --info-soft:#E2EAFA;
  --garment-line:#CFCAD6;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(26,22,34,.06),0 8px 24px rgba(26,22,34,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141118; --surface:#1D1923; --surface-2:#231E2A; --line:#332C3C; --ink:#EEEAF2; --muted:#A29AAE;
  --accent:#E07A98; --accent-ink:#1A0E13; --accent-soft:#3A1F2A;
  --side:#0E0C11; --side-ink:#E9E4EE; --side-muted:#8E869B; --side-hi:#221D29;
  --ok:#5BD3A1; --ok-soft:#173327; --warn:#F2B35B; --warn-soft:#3A2A12; --bad:#FF8A7E; --bad-soft:#3D1C19; --info:#8EB2FF; --info-soft:#1C2740;
  --garment-line:#4A4255; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141118; --surface:#1D1923; --surface-2:#231E2A; --line:#332C3C; --ink:#EEEAF2; --muted:#A29AAE;
  --accent:#E07A98; --accent-ink:#1A0E13; --accent-soft:#3A1F2A;
  --side:#0E0C11; --side-ink:#E9E4EE; --side-muted:#8E869B; --side-hi:#221D29;
  --ok:#5BD3A1; --ok-soft:#173327; --warn:#F2B35B; --warn-soft:#3A2A12; --bad:#FF8A7E; --bad-soft:#3D1C19; --info:#8EB2FF; --info-soft:#1C2740;
  --garment-line:#4A4255; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(24px,3vw,32px);font-weight:800}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Kabuk */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 20px var(--f-display)}
.brand b{font:800 22px/1 var(--f-display);letter-spacing:.06em}
.brand small{display:block;font:500 11px var(--f-mono);color:var(--side-muted);letter-spacing:.1em;margin-top:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-muted);text-decoration:none;font-weight:600}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{color:var(--side-ink);background:var(--side-hi)}
.nav a.on{color:var(--side-ink);background:var(--side-hi)}
.nav a .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font:700 11px var(--f-mono);border-radius:99px;padding:2px 7px}
.nav-sep{font:600 10px var(--f-mono);letter-spacing:.14em;color:var(--side-muted);padding:18px 12px 6px;text-transform:uppercase}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:12px;border-top:1px solid var(--side-hi);display:grid;gap:8px}
.side-foot button{background:none;border:1px solid var(--side-hi);color:var(--side-ink);border-radius:8px;padding:7px 10px;font-size:12px;text-align:left}

.main{min-width:0;padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.topbar .sub{color:var(--muted);margin-top:4px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--f-mono);letter-spacing:.08em;color:var(--warn);background:var(--warn-soft);padding:5px 10px;border-radius:99px;text-transform:uppercase}

/* Bileşenler */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-b{padding:16px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:700;border:1px solid var(--line);background:var(--surface);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);padding:5px 9px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-yeni{color:var(--info);background:var(--info-soft)}
.st-baskida{color:var(--warn);background:var(--warn-soft)}
.st-kalite{color:var(--accent);background:var(--accent-soft)}
.st-hazir{color:var(--ok);background:var(--ok-soft)}
.st-teslim{color:var(--muted);background:var(--surface-2)}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--garment-line);vertical-align:-2px;flex:none}

.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi .v{font:700 30px/1.1 var(--f-display);margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:13px;color:var(--muted);margin-top:4px}
.kpi.alert .v{color:var(--bad)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.sz{text-align:center;width:64px}
.sz input{width:52px;text-align:center;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 2px;font:500 14px var(--f-mono)}
.sz input:hover{border-color:var(--line)}
.sz input:focus{border-color:var(--accent);background:var(--surface)}
.sz.low input{color:var(--bad);background:var(--bad-soft);font-weight:600}
.sz.zero input{color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.meter{height:6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;width:110px}
.meter i{display:block;height:100%}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:6px}
.field label,.lbl{font:600 12px var(--f-body);color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
textarea.input{resize:vertical;min-height:72px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-weight:600;font-size:14px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.row{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.sizes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sizes .s{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:var(--surface)}
.sizes .s b{display:block;font:700 13px var(--f-mono)}
.sizes .s input{width:100%;text-align:center;border:0;background:var(--surface-2);border-radius:7px;padding:6px 0;margin:6px 0 4px;font:600 15px var(--f-mono)}
.sizes .s small{font:500 11px var(--f-mono);color:var(--muted)}
.sizes .s.over{border-color:var(--bad);background:var(--bad-soft)}
.sizes .s.over small{color:var(--bad)}

.order-layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.preview{position:sticky;top:20px}
.garment-stage{background:var(--surface-2);border-radius:10px;display:grid;place-items:center;padding:12px;position:relative}
.garment-stage svg{width:100%;max-width:320px;height:auto}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-weight:600;text-align:right}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;background:var(--surface-2)}
.drop.has{border-style:solid;border-color:var(--ok)}
.drop img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:var(--surface)}
.section-t{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.section-t .n{font:600 12px var(--f-mono);color:var(--accent)}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.notice{border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}

/* Atölye kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0;display:flex;flex-direction:column;gap:10px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px}
.col-h .c{font:600 12px var(--f-mono);color:var(--muted)}
.job{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;box-shadow:var(--shadow)}
.job.fresh{border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
.job-top{display:flex;gap:10px}
.job-thumb{width:64px;height:72px;flex:none;background:var(--surface-2);border-radius:8px;display:grid;place-items:center}
.job-thumb svg{width:90%;height:90%}
.job .id{font:600 12px var(--f-mono);color:var(--accent)}
.job .t{font-weight:700;line-height:1.3}
.job .m{font-size:12.5px;color:var(--muted)}
.job-acts{display:flex;gap:6px}
.job-acts .btn{flex:1}
.due{font:500 12px var(--f-mono)}
.due.late{color:var(--bad)}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:18px 8px;border:1.5px dashed var(--line);border-radius:10px}

/* Çekmece */
.scrim{position:fixed;inset:0;background:rgba(10,8,14,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2);
  padding-block:calc(22px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:36px;height:36px;font-size:18px;line-height:1}
.timeline{display:grid;gap:0;margin-top:6px}
.tl{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tl::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700}
.tl.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tl.cur .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl small{display:block;color:var(--muted);font-size:12px}

.toast{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-weight:600;box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 32px));display:flex;gap:10px;align-items:center;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}}

.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{width:100%;max-width:34px;background:var(--accent-soft);border-radius:6px 6px 2px 2px;border:1px solid var(--accent);border-bottom:0;display:block}
.bars .b.today i{background:var(--accent)}
.bars .b span{font:500 11px var(--f-mono);color:var(--muted)}
.bars .b em{font:600 12px var(--f-mono);font-style:normal}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pipe a{text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.pipe a b{display:block;font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.workshop-mode .side{background:#0B1F1A}
.mode-switch{display:flex;background:var(--side-hi);border-radius:10px;padding:3px;margin:0 4px 14px}
.mode-switch button{flex:1;border:0;background:transparent;color:var(--side-muted);border-radius:8px;padding:7px 6px;font-weight:700;font-size:12.5px}
.mode-switch button.on{background:var(--side-ink);color:var(--side)}
.mob-nav{display:none}

@media (max-width:1100px){
  .order-layout{grid-template-columns:minmax(0,1fr)}
  .preview{position:static}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;z-index:20;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  .brand{padding:0}
  .brand small,.nav,.nav-sep,.side-foot{display:none}
  .mode-switch{margin:0 0 0 auto;min-width:0}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:minmax(0,1fr)}
  .mob-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .mob-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;position:relative}
  .mob-nav a svg{width:20px;height:20px}
  .mob-nav a.on{color:var(--accent)}
  .mob-nav a .badge{position:absolute;top:4px;left:55%;background:var(--accent);color:var(--accent-ink);font:700 10px var(--f-mono);border-radius:99px;padding:1px 5px}
  .sizes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .kanban{grid-template-columns:minmax(0,1fr);overflow:visible}
  .topbar .btn{padding:9px 13px}
  .filters{width:100%}
  .filters .input{width:100%!important}
  table.cards,table.cards tbody{display:block}
  table.cards thead{display:none}
  table.cards tr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 8px;padding:14px 16px;border-bottom:1px solid var(--line)}
  table.cards tr:last-child{border-bottom:0}
  table.cards td{display:block;padding:0;border:0;min-width:0;width:auto}
  table.cards td[data-label]::before{content:attr(data-label);display:block;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  table.cards .c-full{grid-column:1/-1}
  table.cards tr.click:hover td{background:transparent}
  table.cards .c-3{grid-column:span 3}
  table.cards .c-2{grid-column:span 2}
  table.cards .sz{text-align:center}
  table.cards .sz input{width:100%;background:var(--surface-2)}
  table.cards .meter{width:100%;margin-top:8px}
  table.orders tr{grid-template-columns:minmax(0,1fr) auto}
  table.orders .o-id{grid-column:1;grid-row:1}
  table.orders .o-st{grid-column:2;grid-row:1;justify-self:end}
  table.orders td{white-space:normal!important}
  .drawer .spec{font-size:13.5px}
  .kpi .v{font-size:26px}
}

/* Kullanıcı kutusu + giriş ekranı */
[hidden]{display:none!important}
.who{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:0 4px 8px;min-width:0}
.who .mode-switch button{white-space:nowrap}
@media (max-width:860px){.app{align-content:start}}
.who-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--side-hi)}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px var(--f-body);flex:none}
.who-user .nm{min-width:0;flex:1}
.who-user b{display:block;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-user small{display:block;font-size:12px;color:var(--side-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out{border:1px solid var(--side-muted);background:transparent;color:var(--side-ink);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:600;flex:none}
.who .mode-switch{margin:0}
.who .sw-l{font:600 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:0 2px}

// ---------------- Yardımcılar ----------------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const prod=id=>S.products.find(p=>p.id===id);
const total=q=>SIZES.reduce((a,z)=>a+(+q[z]||0),0);
const stockTotal=p=>total(stk(p));
const fmtTL=n=>n.toLocaleString("tr-TR")+" ₺";
const fmtDate=s=>{const d=new Date(s+"T00:00");return d.getDate()+" "+MONTHS[d.getMonth()]};
const daysLeft=s=>Math.round((new Date(s+"T00:00")-T0)/864e5);
const qtyText=q=>SIZES.filter(z=>+q[z]>0).map(z=>z+"×"+q[z]).join(" · ");
const chip=s=>`<span class="chip st-${s}">${STATUS[s].t}</span>`;
const isLow=(p,z)=>stk(p)[z]<=Math.ceil(p.min/2);
const lowCells=()=>S.products.reduce((a,p)=>a+SIZES.filter(z=>isLow(p,z)).length,0);
const newJobs=()=>myOrders().filter(o=>o.status==="yeni"&&!S.seen.includes(o.id)).length;
const nowStamp=()=>{const d=new Date();return T0.getDate()+" "+MONTHS[T0.getMonth()]+" "+pad(d.getHours())+":"+pad(d.getMinutes())};
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toLocaleUpperCase("tr")).join("");
const roleChip=r=>`<span class="role-chip r-${r}">${ROLES[r]}</span>`;
const where=u=>u.role==="admin"?"Tüm mağazalar":u.role==="ws"?store(u.store).ws:store(u.store).name;
const unreadOf=o=>(o.unread&&o.unread[side()])||0;
const mBadge=o=>unreadOf(o)?`<span class="mcount" title="Okunmamış mesaj">💬 ${unreadOf(o)}</span>`:"";
const holdChip=o=>o.hold?`<span class="chip st-hold">Beklemede</span>`:"";
const ordersNeedingMe=()=>myOrders().filter(o=>(side()==="store"&&o.hold)||unreadOf(o)>0);
const trIncoming=()=>S.transfers.filter(t=>t.from===curStore()&&t.status==="bekliyor");
const trToReceive=()=>S.transfers.filter(t=>t.to===curStore()&&t.status==="yolda");
const trBadge=()=>trIncoming().length+trToReceive().length;
const custKey=o=>(o.phone||"").replace(/\D/g,"")||o.customer.toLocaleLowerCase("tr");
function customers(){
  const m=new Map();
  myOrders().slice().sort((a,b)=>b.created.localeCompare(a.created)).forEach(o=>{
    const k=custKey(o); if(!m.has(k)) m.set(k,{key:k,name:o.customer,phone:o.phone,orders:[]}); m.get(k).orders.push(o)});
  return [...m.values()];
}

function toast(html){
  const t=document.createElement("div");t.className="toast";t.innerHTML=html;document.body.appendChild(t);
  setTimeout(()=>{t.style.transition="opacity .3s";t.style.opacity="0";setTimeout(()=>t.remove(),300)},3400);
}

// Giysi çizimi (ön/arka) + baskı yerleşimi
function isDark(hex){const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000<110}
function garment(p,design,sd,opts={}){
  const hex=p?p.hex:"#F7F6F2",cat=p?p.cat:"tisort",dark=isDark(hex);
  const body=cat==="hoodie"||cat==="sweat"
   ?"M118 28 L58 56 L18 210 L60 222 L92 120 L92 380 L268 380 L268 120 L300 222 L342 210 L302 56 L242 28 Q180 62 118 28 Z"
   :"M118 26 L60 52 L20 122 L70 146 L92 116 L92 380 L268 380 L268 116 L290 146 L340 122 L300 52 L242 26 Q180 64 118 26 Z";
  const stroke=dark?"rgba(255,255,255,.18)":"rgba(0,0,0,.16)";
  let extra="";
  if(cat==="hoodie"){
    extra=sd==="on"
      ?`<path d="M128 30 Q180 110 232 30 Q214 4 180 2 Q146 4 128 30Z" fill="${hex}" stroke="${stroke}" stroke-width="2"/><path d="M168 66 L166 120 M192 66 L194 120" stroke="${stroke}" stroke-width="2"/><path d="M128 300 L232 300 L240 360 L120 360Z" fill="none" stroke="${stroke}" stroke-width="2"/>`
      :`<path d="M124 32 Q180 -18 236 32 Q236 70 180 84 Q124 70 124 32Z" fill="${hex}" stroke="${stroke}" stroke-width="2"/>`;
  }else if(cat==="polo"){
    extra=sd==="on"?`<path d="M150 34 L180 70 L210 34" fill="none" stroke="${stroke}" stroke-width="3"/><path d="M180 70 L180 120" stroke="${stroke}" stroke-width="2"/><circle cx="180" cy="86" r="2.5" fill="${stroke}"/><circle cx="180" cy="104" r="2.5" fill="${stroke}"/>`:"";
  }else{
    extra=sd==="on"?`<path d="M118 26 Q180 72 242 26" fill="none" stroke="${stroke}" stroke-width="5"/>`:`<path d="M126 30 Q180 46 234 30" fill="none" stroke="${stroke}" stroke-width="4"/>`;
  }
  let art="";
  if(design&&PLACES[design.place]&&PLACES[design.place].side===sd){
    const pl=PLACES[design.place],w=Math.max(16,Math.min(pl.max,+design.cm||8))*PX_PER_CM,x=pl.x-w/2,y=pl.y-w/2;
    if(design.kind==="yazi"){
      const txt=design.text||"YAZI",fs=Math.min(w/Math.max(2,txt.length)*1.7,w*.55);
      art=`<text x="${pl.x}" y="${pl.y}" text-anchor="middle" dominant-baseline="middle" font-family="Bricolage Grotesque, Figtree, sans-serif" font-weight="800" font-size="${fs.toFixed(1)}" fill="${design.ink||"#111"}" letter-spacing="1">${esc(txt)}</text>`;
    }else if(design.file){
      art=`<image href="${design.file}" x="${x}" y="${y}" width="${w}" height="${w}" preserveAspectRatio="xMidYMid meet"/>`;
    }else art=sampleMark(design,pl.x,pl.y,w);
    if(opts.guide){
      art+=`<rect x="${x-4}" y="${y-4}" width="${w+8}" height="${w+8}" rx="4" fill="none" stroke="#E0457B" stroke-width="1.5" stroke-dasharray="5 4"/>`+
           `<text x="${pl.x}" y="${y+w+18}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#E0457B">${(+design.cm||0)} cm</text>`;
    }
  }
  return `<svg viewBox="0 0 360 400" role="img" aria-label="${esc((p?p.name+" "+p.color:"Ürün")+" — "+(sd==="on"?"ön":"arka"))}"><path d="${body}" fill="${hex}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>${extra}${art}</svg>`;
}
function sampleMark(d,cx,cy,w){
  const r=w/2,ink=d.ink||"#1F2B4D",initial=esc((d.text||"A").trim().charAt(0).toLocaleUpperCase("tr"));
  if(d.kind==="desen"){
    let s=`<g><rect x="${cx-r}" y="${cy-r}" width="${w}" height="${w}" rx="${w*.12}" fill="${ink}"/>`;
    for(let i=0;i<4;i++)s+=`<circle cx="${cx}" cy="${cy}" r="${r*(.25+i*.18)}" fill="none" stroke="#F3D27A" stroke-width="${Math.max(1,w*.025)}"/>`;
    return s+`<text x="${cx}" y="${cy+r*.8}" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="${w*.16}" fill="#F7F6F2">${esc(d.text||"")}</text></g>`;
  }
  return `<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="${ink}"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="${w*.5}" fill="${isDark(ink)?"#F7F6F2":"#1A1622"}">${initial}</text></g>`;
}
const thumb=(o,w=44,h=50)=>`<div class="job-thumb" style="width:${w}px;height:${h}px">${garment(prod(o.productId),o.design,PLACES[o.design.place].side)}</div>`;

  $("#app").hidden=true; const L=$("#login"); L.hidden=false;
  const order=["yonetici","magaza1","atolye1","magaza2","atolye2"];
  const demo=S.users.filter(u=>order.includes(u.u)).sort((a,b)=>order.indexOf(a.u)-order.indexOf(b.u));
  L.innerHTML=`<div class="login-wrap">
    <div class="panel login-card">
      <div class="brand"><div class="brand-mark">A</div><div><b>ARMEN</b><small>STOK · SİPARİŞ · ATÖLYE</small></div></div>
      <h1 style="font-size:26px">Giriş yap</h1>
      <p class="muted" style="margin:6px 0 22px">Size verilen kullanıcı adı ve şifreyle giriş yapın. Yalnızca çalıştığınız mağazanın verilerini görürsünüz.</p>
      <form id="lf" class="stack" autocomplete="off">
        <div class="field"><label for="lu">Kullanıcı adı</label><input class="input" id="lu" autocomplete="off" autocapitalize="none" spellcheck="false" required></div>
        <div class="field"><label for="lp">Şifre</label><input class="input" id="lp" type="password" autocomplete="off" required></div>
        ${err?`<div class="login-err" role="alert">${esc(err)}</div>`:""}
        <button class="btn primary" type="submit">Giriş yap</button>
      </form>
    </div>
    <div class="panel demo-acc">
      <div class="eyebrow">Demo hesapları</div>
      <p class="muted" style="font-size:13px;margin:8px 0 14px">Prototipi denemek için bir hesaba tıklayın; bilgiler forma dolar.</p>
      <div class="stack" style="gap:8px">${demo.map(u=>`<button type="button" class="acc" data-u="${esc(u.u)}"><span class="av">${esc(initials(u.name))}</span><span class="nm"><b>${esc(u.name)}</b><small>${ROLES[u.role]} · ${esc(where(u))}</small></span><code>${esc(u.u)} / ${esc(u.p)}</code></button>`).join("")}</div>
    </div>
  </div>`;
  L.querySelectorAll(".acc").forEach(b=>b.onclick=()=>{const u=S.users.find(x=>x.u===b.dataset.u);$("#lu").value=u.u;$("#lp").value=u.p;$("#lp").focus()});
  $("#lf").onsubmit=e=>{e.preventDefault();
    const u=S.users.find(x=>x.u===$("#lu").value.trim().toLocaleLowerCase("tr"));
    if(!u||u.p!==$("#lp").value){renderLogin("Kullanıcı adı veya şifre hatalı. Demo hesaplarından birini seçebilirsiniz.");return}
    me=u; adminMode="store"; draft=null; try{localStorage.setItem(KEY+"-user",u.u)}catch(_){}
    location.hash=u.role==="ws"?"atolye":"panel"; render();
  };
}
function logout(){me=null;draft=null;try{localStorage.removeItem(KEY+"-user")}catch(_){} closeLayer(); history.replaceState(null,"",location.pathname+location.search); render()}

// ---------------- Navigasyon ----------------
function allowed(){
  if(mode()==="shop") return me.role==="admin"?["atolye","kullanicilar"]:["atolye"];
  const r=["panel","stok","siparisler","yeni-siparis","musteriler","transferler","atolye","menu"];
  return me.role==="admin"?r.concat("kullanicilar"):r;
}
function route(){const h=location.hash.replace("#","");const a=allowed();return a.includes(h)?h:a[0]}
function go(id){if(location.hash==="#"+id)render();else location.hash=id}

function renderWho(){
  const st=store();
  let h=`<div class="who-user"><span class="av" title="${esc(me.name)}">${esc(initials(me.name))}</span><span class="nm"><b>${esc(me.name)}</b><small>${ROLES[me.role]} · ${esc(me.role==="admin"?"tüm mağazalar":me.role==="ws"?st.ws:st.name)}</small></span><button class="out" id="out" type="button">Çıkış</button></div>`;
  if(me.role==="admin"){
    h+=`<div class="sw-l">Şube</div><div class="mode-switch" id="sw-store">${S.stores.map(s=>`<button type="button" data-v="${s.id}" class="${adminScope===s.id?"on":""}">${esc(s.name)}</button>`).join("")}</div>
        <div class="sw-l">Görünüm</div><div class="mode-switch" id="sw-mode"><button type="button" data-v="store" class="${adminMode==="store"?"on":""}">Mağaza</button><button type="button" data-v="shop" class="${adminMode==="shop"?"on":""}">Atölye</button></div>`;
  }
  $("#who").innerHTML=h;
  $("#out").onclick=logout;
  if(me.role==="admin"){
    $("#sw-store").querySelectorAll("button").forEach(b=>b.onclick=()=>{adminScope=b.dataset.v;draft=null;try{localStorage.setItem(KEY+"-scope",adminScope)}catch(_){} closeLayer();render();toast(`${esc(store().name)} ve ${esc(store().ws)} görüntüleniyor`)});
    $("#sw-mode").querySelectorAll("button").forEach(b=>b.onclick=()=>{adminMode=b.dataset.v;closeLayer();location.hash=adminMode==="shop"?"atolye":"panel";render()});
  }
}
function renderNav(){
  const r=route(),st=store(),bj=newJobs()+ordersNeedingMe().length,ob=ordersNeedingMe().length,tb=trBadge();
  const link=(id,label,ic,badge)=>`<a href="#${id}" class="${r===id?"on":""}">${ICON[ic]}<span>${label}</span>${badge?`<span class="badge">${badge}</span>`:""}</a>`;
  let h="";
  if(mode()==="store"){
    h+=`<div class="nav-sep">${esc(st.name)}</div>`+link("panel","Genel bakış","panel")+link("stok","Stok","stok",lowCells()||"")+link("siparisler","Siparişler","siparis",ob||"")+link("yeni-siparis","Yeni sipariş","yeni")+link("musteriler","Müşteriler","musteri")+link("transferler","Şube transferi","transfer",tb||"");
    h+=`<div class="nav-sep">Bağlı atölye</div>`+link("atolye",esc(st.ws),"atolye");
  }else{
    h+=`<div class="nav-sep">${esc(st.ws)}</div>`+link("atolye","İş emirleri","atolye",bj||"");
  }
  if(me.role==="admin") h+=`<div class="nav-sep">Yönetim</div>`+link("kullanicilar","Kullanıcılar","users");
  $("#nav").innerHTML=h;
  let m=mode()==="store"
    ?[["panel","Özet","panel",0],["stok","Stok","stok",0],["yeni-siparis","Sipariş","yeni",0],["siparisler","Liste","siparis",ob],["atolye","Atölye","atolye",0],["menu","Diğer","menu",tb]]
    :[["atolye","İş emirleri","atolye",bj]].concat(me.role==="admin"?[["kullanicilar","Kişiler","users",0]]:[]);
  $("#mobnav").hidden=m.length<2;
  const mr=["musteriler","transferler","kullanicilar"].includes(r)&&mode()==="store"?"menu":r;
  $("#mobnav").innerHTML=m.map(([id,l,ic,b])=>`<a href="#${id}" class="${mr===id?"on":""}">${ICON[ic]}<span>${l}</span>${b?`<span class="badge">${b}</span>`:""}</a>`).join("");
  $("#app").classList.toggle("workshop-mode",mode()==="shop");
}

function render(){
  if(!me){renderLogin();return}
  $("#login").hidden=true;$("#login").innerHTML="";$("#app").hidden=false;
  const r=route();
  if(location.hash!=="#"+r){history.replaceState(null,"","#"+r)}
  renderWho();renderNav();
  ({panel:viewPanel,stok:viewStock,siparisler:viewOrders,"yeni-siparis":viewNew,musteriler:viewCustomers,transferler:viewTransfers,atolye:viewWorkshop,kullanicilar:viewUsers,menu:viewMenu})[r]($("#view"));
  window.scrollTo(0,0);
}
function topbar(title,sub,right=""){
  const st=store(),ctx=mode()==="shop"?st.ws:st.name;
  return `<div class="topbar"><div><div class="eyebrow">Armen · ${esc(ctx)}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="demo-tag">Örnek veri</span>${right}</div></div>`;
}
function closeLayer(){$("#layer").innerHTML=""}
function drawer(label,inner){
  $("#layer").innerHTML=`<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-label="${esc(label)}">${inner}</aside>`;
  $("#scrim").onclick=closeLayer;const c=$("#cls");if(c)c.onclick=closeLayer;
}

// ---------------- Genel bakış ----------------
function attention(){
  const items=[];
  myOrders().filter(o=>o.hold).forEach(o=>items.push({ic:"⚠",c:"ic-bad",t:`${o.id} · ${esc(o.customer)}`,s:`${esc(store().ws)} sorun bildirdi: ${esc(o.hold.reason)}. İş beklemede.`,open:o.id}));
  myOrders().filter(o=>!o.hold&&unreadOf(o)).forEach(o=>items.push({ic:"💬",c:"ic-info",t:`${o.id} · ${esc(o.customer)}`,s:`${unreadOf(o)} yeni mesaj: “${esc(o.messages[o.messages.length-1].text.slice(0,70))}”`,open:o.id}));
  trIncoming().forEach(t=>{const p=prod(t.product);items.push({ic:"⇄",c:"ic-warn",t:`${t.id} · ${esc(store(t.to).name)} transfer istiyor`,s:`${total(t.qty)} adet ${esc(p.name)} ${esc(p.color)} (${qtyText(t.qty)}). Onayınız bekleniyor.`,go:"transferler"})});
  trToReceive().forEach(t=>{const p=prod(t.product);items.push({ic:"⇄",c:"ic-info",t:`${t.id} · ${esc(store(t.from).name)}'dan yolda`,s:`${total(t.qty)} adet ${esc(p.name)} ${esc(p.color)}. Ürün gelince teslim aldım deyin.`,go:"transferler"})});
  return items;
}

  <div class="kpis">
    <div class="panel kpi"><div class="eyebrow">Stoktaki ürün</div><div class="v">${pieces.toLocaleString("tr-TR")}</div><div class="d">${S.products.length} model · ${fmtTL(value)} değer</div></div>
    <div class="panel kpi"><div class="eyebrow">Açık sipariş</div><div class="v">${active.length}</div><div class="d">${active.reduce((a,o)=>a+total(o.qty),0)} parça üretimde</div></div>
    <div class="panel kpi ${late.length?"alert":""}"><div class="eyebrow">Teslimi yaklaşan</div><div class="v">${late.length}</div><div class="d">1 gün veya daha az kaldı</div></div>

        <div class="panel-b"><div class="pipe">
          ${["yeni","baskida","kalite","hazir"].map(s=>`<a href="#atolye"><span class="chip st-${s}">${STATUS[s].t}</span><b>${cnt(s)}</b><span class="muted" style="font-size:12px">${orders.filter(o=>o.status===s).reduce((a,o)=>a+total(o.qty),0)} parça</span></a>`).join("")}
        </div></div></div>
      <div class="panel"><div class="panel-h"><h2>Son siparişler</h2><a class="btn sm ghost" href="#siparisler">Tümü →</a></div>
        <div class="panel-b" style="padding-block:4px">${orders.length?orders.slice(0,5).map(o=>{const p=prod(o.productId);return `
          <div class="list-row" data-open="${o.id}" style="cursor:pointer">${thumb(o)}
            <div class="grow"><b>${esc(o.customer)}</b><span class="muted" style="font-size:13px"><span class="mono">${o.id}</span> · ${total(o.qty)} × ${esc(p.name)}</span></div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${mBadge(o)}${o.hold?holdChip(o):chip(o.status)}</div></div>`}).join(""):`<p class="muted" style="padding:12px 0">Henüz sipariş yok.</p>`}</div></div>

        <div class="panel-b"><div class="bars">${sales.map((n,i)=>`<div class="b ${i===6?"today":""}"><em>${n||""}</em><i style="height:${Math.max(3,n/max*110)}px"></i><span>${i===6?"Bugün":dayLbl(i)}</span></div>`).join("")}</div></div></div>
      <div class="panel"><div class="panel-h"><h2>Kritik stok</h2><a class="btn sm ghost" href="#stok">Stoğa git →</a></div>
        <div class="panel-b" style="padding-block:4px">${lows.length?lows.slice(0,6).map(([p,z])=>{const n=stk(p)[z];return `
          <div class="list-row"><span class="swatch" style="background:${p.hex}"></span><div class="grow"><b>${esc(p.name)}</b><span class="muted" style="font-size:13px">${esc(p.color)} · beden ${z}</span></div>
          <span class="chip ${n===0?"st-red":"st-baskida"}">${n===0?"Tükendi":n+" adet"}</span></div>`}).join(""):`<p class="muted" style="padding:12px 0">Kritik seviyede ürün yok.</p>`}</div></div>
    </div>
  </div>`;
  v.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openOrder(el.dataset.open));

// ---------------- Stok ----------------
function viewStock(v){
  const cats={all:"Tümü",tisort:"Tişört",polo:"Polo",hoodie:"Kapüşonlu",sweat:"Sweatshirt"};
  v.innerHTML=topbar("Stok",`${esc(store().name)} stoğu. Hücreye tıklayıp adet girin; eksik bedeni diğer şubeden isteyebilirsiniz.`,`<button class="btn" id="add-prod" type="button">+ Ürün ekle</button>`)+`

// ---------------- Şubeler arası stok + transfer ----------------
function createTransfer(pid,qty,note){
  const t={id:"TR-"+(S.trSeq++),product:pid,from:otherStore().id,to:curStore(),qty,status:"bekliyor",note,by:me.name,at:nowStamp(),log:[]};
  S.transfers.unshift(t);save();renderNav();
  toast(`⇄ <span><b class="mono">${t.id}</b> ${esc(otherStore().name)}'a gönderildi · ${total(qty)} adet</span>`);
  return t;
}
function openBranch(pid,pre){
  const p=prod(pid),me_s=store(),ot=otherStore(),mine=p.stock[me_s.id],theirs=p.stock[ot.id];
  const ask=pre||Object.fromEntries(SIZES.map(z=>[z,0]));
  drawer("Şube stoğu",`<div class="drawer-h"><div><div class="eyebrow">Şubeler arası stok</div><h2>${esc(p.name)} · ${esc(p.color)}</h2></div><button class="x" id="cls" type="button" aria-label="Kapat">×</button></div>
    <div class="stack">
      <div class="panel"><div class="tbl-wrap"><table class="branch-tbl"><thead><tr><th>Şube</th>${SIZES.map(z=>`<th>${z}</th>`).join("")}<th>Toplam</th></tr></thead><tbody>
        <tr><td><b>${esc(me_s.name)}</b> <span class="muted">(siz)</span></td>${SIZES.map(z=>`<td class="mono">${mine[z]}</td>`).join("")}<td class="mono"><b>${total(mine)}</b></td></tr>
        <tr><td><b>${esc(ot.name)}</b></td>${SIZES.map(z=>`<td class="mono">${theirs[z]}</td>`).join("")}<td class="mono"><b>${total(theirs)}</b></td></tr>
      </tbody></table></div></div>
      <p class="muted" style="font-size:12.5px">Diğer şubenin yalnızca adetlerini görürsünüz; fiyat ve siparişleri görünmez.</p>
      <form id="tf" class="stack">
        <h3>${esc(ot.name)}'dan transfer iste</h3>
        <div class="sizes">${SIZES.map(z=>`<div class="s"><b>${z}</b><input id="tq-${z}" type="number" min="0" max="${theirs[z]}" value="${Math.min(ask[z]||0,theirs[z])}" data-z="${z}"><small>en fazla ${theirs[z]}</small></div>`).join("")}</div>
        <div class="field"><label for="tn">Not</label><input class="input" id="tn" placeholder="Örn. Kuzey Kafe siparişi için" value="${esc((pre&&pre._note)||"")}"></div>
        <div id="terr"></div>
        <button class="btn primary" type="submit">Transfer talebi gönder</button>
        <p class="muted" style="font-size:12.5px">${esc(ot.name)} onaylayınca ürün yola çıkar; siz teslim aldığınızda stoğunuza eklenir.</p>
      </form>
    </div>`);
  $("#tf").onsubmit=e=>{e.preventDefault();
    const qty=Object.fromEntries(SIZES.map(z=>[z,Math.max(0,parseInt($("#tq-"+z).value)||0)]));
    const over=SIZES.filter(z=>qty[z]>theirs[z]);
    if(!total(qty))return $("#terr").innerHTML=`<div class="notice bad">En az bir beden için adet girin.</div>`;
    if(over.length)return $("#terr").innerHTML=`<div class="notice bad">${esc(ot.name)}'da yeterli stok yok: ${over.join(", ")}</div>`;
    createTransfer(pid,qty,$("#tn").value.trim());closeLayer();if(route()==="transferler")render();
  };
}

  v.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{S.transfers=S.transfers.filter(t=>t.id!==b.dataset.cancel);save();render();toast("Talep geri çekildi")});
}

function newDraft(){return {store:curStore(),customer:"",phone:"",productId:"p1",qty:{S:0,M:0,L:0,XL:0,XXL:0},kind:"logo",place:"gogus-sol",tech:"DTF baskı",cm:9,text:"",ink:"#1F2B4D",file:null,fileName:null,due:day(7),note:"",side:"on",repeatOf:null}}
function viewNew(v){
  if(!draft||draft.store!==curStore()) draft=newDraft();
  const d=draft,st=store(),ot=otherStore();
  const groups={};S.products.forEach(p=>{(groups[p.name]=groups[p.name]||[]).push(p)});
  v.innerHTML=topbar("Yeni sipariş",`Ürünü, bedenleri ve baskı detayını girin. Kaydedince ${esc(st.name)} stoğu düşer, iş emri ${esc(st.ws)}'ye gider.`)+`
  ${d.repeatOf?`<div class="repeat"><span>↻ ${d.repeatOf} siparişinden kopyalandı: ürün, bedenler, logo ve baskı ayarları hazır.</span><button class="btn sm" type="button" id="clr">Boş forma dön</button></div>`:""}
  <form id="of" class="order-layout" novalidate>
    <div class="stack">
      <div class="panel"><div class="panel-b stack">
        <div class="section-t"><span class="n">1</span><h2>Müşteri</h2></div>
        <div class="row">
          <div class="field"><label for="cust">Müşteri / firma adı</label><input class="input" id="cust" required placeholder="Örn. Kuzey Kafe" value="${esc(d.customer)}" autocomplete="off"></div>
          <div class="field"><label for="phone">Telefon</label><input class="input" id="phone" inputmode="tel" placeholder="05xx xxx xx xx" value="${esc(d.phone)}" autocomplete="off"></div>
        </div>
        <div id="custhint" class="hints"></div>
      </div></div>
      <div class="panel"><div class="panel-b stack">
        <div class="section-t"><span class="n">2</span><h2>Ürün ve beden</h2></div>
        <div class="field"><label for="prod">Ürün ve renk</label>
          <select class="input" id="prod">${Object.entries(groups).map(([n,ps])=>`<optgroup label="${esc(n)}">${ps.map(p=>`<option value="${p.id}" ${p.id===d.productId?"selected":""}>${esc(p.name)} — ${esc(p.color)} (${stockTotal(p)} adet stokta)</option>`).join("")}</optgroup>`).join("")}</select></div>
        <div><div class="lbl" style="margin-bottom:6px">Beden dağılımı · ${esc(st.name)} stoğu</div><div class="sizes" id="sizes"></div></div>
        <div id="stockmsg"></div>
      </div></div>
      <div class="panel"><div class="panel-b stack">
        <div class="section-t"><span class="n">3</span><h2>Baskı detayı</h2></div>
        <div class="field"><span class="lbl">Baskı türü</span><div class="seg" id="kind">${Object.entries(KINDS).map(([k,l])=>`<button type="button" data-v="${k}" class="${d.kind===k?"on":""}">${l}</button>`).join("")}</div></div>
        <div id="filebox"></div>
        <div class="field"><span class="lbl">Konum</span><div class="seg" id="place">${Object.entries(PLACES).map(([k,p])=>`<button type="button" data-v="${k}" class="${d.place===k?"on":""}">${p.t}</button>`).join("")}</div></div>
        <div class="row">
          <div class="field"><label for="tech">Baskı tekniği</label><select class="input" id="tech">${TECH.map(t=>`<option ${t===d.tech?"selected":""}>${t}</option>`).join("")}</select></div>
          <div class="field"><label for="cm">Genişlik (cm)</label><input class="input mono" id="cm" type="number" min="3" max="35" value="${d.cm}"></div>
        </div>
        <div class="row">
          <div class="field"><label for="ink">Baskı rengi</label><div style="display:flex;gap:8px"><input id="ink" type="color" value="${d.ink}" class="input" style="width:56px;height:44px;padding:4px"><input class="input mono" id="inkhex" value="${d.ink.toUpperCase()}" aria-label="Renk kodu"></div></div>
          <div class="field"><label for="due">Teslim tarihi</label><input class="input" id="due" type="date" min="${day(0)}" value="${d.due}"></div>
        </div>
        <div class="field"><label for="note">Atölyeye not</label><textarea class="input" id="note" placeholder="Örn. logo yaka dikişinden 8 cm aşağı">${esc(d.note)}</textarea></div>
      </div></div>
    </div>
    <div class="preview stack">
      <div class="panel"><div class="panel-h"><h2>Önizleme</h2><div class="seg" id="side"><button type="button" data-v="on" class="${d.side==="on"?"on":""}">Ön</button><button type="button" data-v="arka" class="${d.side==="arka"?"on":""}">Arka</button></div></div>
        <div class="panel-b stack"><div class="garment-stage" id="stage"></div><dl class="spec" id="spec"></dl>
          <button class="btn primary" type="submit" id="send">Kaydet ve ${esc(st.ws)}'ye gönder →</button>
          <p class="muted" style="font-size:12.5px">İş emri yalnızca ${esc(st.ws)} ekranına düşer.</p>
        </div></div>
    </div>
  </form>`;
  const P=()=>prod(d.productId);
  const preview=()=>garment(P(),{kind:d.kind,place:d.place,cm:d.cm,text:d.text,ink:d.ink,file:d.file},d.side,{guide:true});
  const clr=$("#clr");if(clr)clr.onclick=()=>{draft=newDraft();viewNew(v)};
  function hints(){
    const box=$("#custhint"),n=d.customer.trim().toLocaleLowerCase("tr"),ph=d.phone.replace(/\D/g,"");
    if(d.repeatOf||(n.length<2&&ph.length<4)){box.innerHTML="";return}
    const m=customers().filter(c=>(n.length>=2&&c.name.toLocaleLowerCase("tr").includes(n))||(ph.length>=4&&(c.phone||"").replace(/\D/g,"").includes(ph))).slice(0,3);
    const exact=m.find(c=>c.name===d.customer.trim()&&(c.phone||"")===d.phone.trim());
    box.innerHTML=m.map(c=>{const last=c.orders[0],p=prod(last.productId);return exact===c
      ?`<div class="hint"><span style="font-size:18px">↻</span><span class="grow"><b>Kayıtlı müşteri · ${c.orders.length} sipariş</b><span>Son: ${last.id} · ${total(last.qty)} × ${esc(p.name)} ${esc(p.color)} · ${KINDS[last.design.kind]} ${PLACES[last.design.place].t.toLocaleLowerCase("tr")}</span></span><button class="btn sm primary" type="button" data-rep="${last.id}">Son siparişi tekrarla</button></div>`
      :`<button type="button" class="hint" data-pick="${esc(c.key)}"><span class="av" style="width:30px;height:30px;font-size:12px">${esc(initials(c.name))}</span><span class="grow"><b>${esc(c.name)}</b><span>${esc(c.phone||"")} · ${c.orders.length} sipariş · son ${fmtDate(last.created)}</span></span><span class="muted" style="font-size:12.5px">Seç</span></button>`}).join("");
    box.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const c=customers().find(x=>x.key===b.dataset.pick);d.customer=c.name;d.phone=c.phone||"";$("#cust").value=d.customer;$("#phone").value=d.phone;hints();update()});
    box.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>{draft=draftFrom(S.orders.find(o=>o.id===b.dataset.rep));viewNew(v);toast("↻ Son sipariş forma kopyalandı")});
  }
  function sizes(){
    const s=stk(P());
    $("#sizes").innerHTML=SIZES.map(z=>`<div class="s ${(+d.qty[z]||0)>s[z]?"over":""}"><b>${z}</b><input id="q-${z}" type="number" min="0" inputmode="numeric" value="${d.qty[z]||0}" data-z="${z}" aria-label="${z} adet"><small>stok ${s[z]}</small></div>`).join("");
    $("#sizes").querySelectorAll("input").forEach(i=>{i.oninput=()=>{d.qty[i.dataset.z]=Math.max(0,parseInt(i.value)||0);i.parentElement.classList.toggle("over",d.qty[i.dataset.z]>stk(P())[i.dataset.z]);update()}});
  }
  function filebox(){
    const fb=$("#filebox");
    if(d.kind==="yazi"){
      fb.innerHTML=`<div class="field"><label for="txt">Basılacak yazı</label><input class="input" id="txt" maxlength="24" placeholder="Örn. ATLAS SK" value="${esc(d.text)}"></div>`;
      $("#txt").oninput=e=>{d.text=e.target.value;update()};
    }else{
      fb.innerHTML=`<div class="drop ${d.file||d.fileName?"has":""}">
        ${d.file?`<img src="${d.file}" alt="Yüklenen tasarım">`:`<div style="width:44px;height:44px;border-radius:8px;background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none">${d.fileName?"📎":"⬆"}</div>`}
        <div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.fileName?esc(d.fileName):(d.kind==="logo"?"Logo dosyası yükleyin":"Desen dosyası yükleyin")}</b><span class="muted" style="font-size:12.5px">${d.fileName&&d.repeatOf?"Önceki siparişteki dosya kullanılacak":"PNG, JPG veya SVG · şeffaf arka plan önerilir"}</span></div>
        <label class="btn sm" for="file">${d.file||d.fileName?"Değiştir":"Dosya seç"}</label><input id="file" type="file" accept="image/*" hidden>
      </div>${!d.file?`<div class="field" style="margin-top:10px"><label for="mk">Önizleme için kısa ad</label><input class="input" id="mk" maxlength="14" placeholder="Örn. KUZEY" value="${esc(d.text)}"></div>`:""}`;
      $("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{d.file=r.result;d.fileName=f.name;filebox();update()};r.readAsDataURL(f)};
      const mk=$("#mk");if(mk)mk.oninput=e=>{d.text=e.target.value;update()};
    }
  }
  function update(){
    const p=P(),s=stk(p),pl=PLACES[d.place],os=p.stock[ot.id];
    if(pl.side!==d.side){d.side=pl.side;$("#side").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===d.side))}
    if(+d.cm>pl.max){d.cm=pl.max;$("#cm").value=pl.max}
    $("#stage").innerHTML=preview();
    const n=total(d.qty);
    $("#spec").innerHTML=`<dt>Müşteri</dt><dd>${esc(d.customer||"—")}</dd><dt>Ürün</dt><dd>${esc(p.name)} · ${esc(p.color)}</dd><dt>Adet</dt><dd class="mono">${n?n+" ("+qtyText(d.qty)+")":"—"}</dd><dt>Baskı</dt><dd>${KINDS[d.kind]} · ${pl.t}</dd><dt>Teknik</dt><dd>${esc(d.tech)} · ${d.cm} cm</dd><dt>Tutar</dt><dd class="mono">${fmtTL(n*p.price)}</dd>`;
    const over=SIZES.filter(z=>(+d.qty[z]||0)>s[z]);
    if(over.length){
      const need=Object.fromEntries(SIZES.map(z=>[z,Math.max(0,(+d.qty[z]||0)-s[z])]));
      const canAll=over.every(z=>os[z]>=need[z]);
      $("#stockmsg").innerHTML=`<div class="notice bad">${esc(st.name)} stoğu yetersiz: ${over.map(z=>z+" (eksik "+need[z]+")").join(", ")}</div>
        <div class="hint" style="border-color:${canAll?"var(--ok)":"var(--warn)"};background:${canAll?"var(--ok-soft)":"var(--warn-soft)"};margin-top:8px"><span style="font-size:18px">⇄</span><span class="grow"><b style="color:${canAll?"var(--ok)":"var(--warn)"}">${esc(ot.name)}'da: ${over.map(z=>z+" "+os[z]+" adet").join(" · ")}</b><span>${canAll?"Eksik adetleri diğer şubeden isteyebilirsiniz.":"Diğer şubede de yeterli stok yok; bulunanı isteyebilirsiniz."}</span></span><button class="btn sm primary" type="button" id="reqtr">Eksiği iste</button></div>`;
      $("#reqtr").onclick=()=>{const pre=Object.fromEntries(SIZES.map(z=>[z,Math.min(need[z],os[z])]));pre._note=(d.customer?d.customer+" siparişi için":"Sipariş için")+" eksik bedenler";openBranch(p.id,pre)};
    }else $("#stockmsg").innerHTML=n?`<div class="notice ok">✓ Tüm bedenler ${esc(st.name)} stoğunda mevcut. Kayıtta ${n} adet düşülecek.</div>`:"";
    $("#send").disabled=!n||over.length>0;
  }
  sizes();filebox();update();hints();
  $("#cust").oninput=e=>{d.customer=e.target.value;e.target.style.borderColor="";hints();update()};
  $("#phone").oninput=e=>{d.phone=e.target.value;hints()};
  $("#prod").onchange=e=>{d.productId=e.target.value;sizes();update()};
  $("#kind").querySelectorAll("button").forEach(b=>b.onclick=()=>{d.kind=b.dataset.v;$("#kind").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));filebox();update()});
  $("#place").querySelectorAll("button").forEach(b=>b.onclick=()=>{d.place=b.dataset.v;$("#place").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));update()});
  $("#side").querySelectorAll("button").forEach(b=>b.onclick=()=>{d.side=b.dataset.v;$("#side").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));$("#stage").innerHTML=preview()});
  $("#tech").onchange=e=>{d.tech=e.target.value;update()};
  $("#cm").oninput=e=>{d.cm=Math.max(3,+e.target.value||3);update()};
  $("#ink").oninput=e=>{d.ink=e.target.value;$("#inkhex").value=d.ink.toUpperCase();update()};
  $("#inkhex").onchange=e=>{if(/^#[0-9a-f]{6}$/i.test(e.target.value)){d.ink=e.target.value;$("#ink").value=d.ink;update()}};
  $("#due").onchange=e=>d.due=e.target.value||d.due;
  $("#note").oninput=e=>d.note=e.target.value;
  $("#of").onsubmit=e=>{
    e.preventDefault();
    const p=P(),s=stk(p);if(!total(d.qty))return;
    if(!d.customer.trim()){$("#cust").focus();$("#cust").style.borderColor="var(--bad)";toast("Müşteri adını girin.");return}
    SIZES.forEach(z=>s[z]-=(+d.qty[z]||0));
    const id="ARM-"+(S.seq[st.id]++);
    const o={id,store:st.id,customer:d.customer.trim(),phone:d.phone.trim(),productId:p.id,qty:{...d.qty},
      design:{kind:d.kind,place:d.place,tech:d.tech,cm:+d.cm,text:d.text,ink:d.ink,file:d.file,fileName:d.kind==="yazi"?null:(d.fileName||((d.text||"logo").toLowerCase().replace(/[^a-z0-9]+/g,"_")+".png"))},
      status:"yeni",created:day(0),due:d.due,note:d.note.trim(),history:[["yeni",nowStamp()]],messages:[],unread:{store:0,ws:0},hold:null};
    if(d.repeatOf)o.messages.push({sys:true,text:`${d.repeatOf} siparişinin tekrarı · aynı dosya ve baskı ayarları`,at:nowStamp()});
    S.orders.unshift(o);S.sales[st.id][6]+=total(o.qty);save();draft=null;
    toast(`🔔 <span><b class="mono">${id}</b> ${esc(st.ws)}'ye iletildi · ${total(o.qty)} adet stoktan düşüldü</span>`);
    go("siparisler");setTimeout(()=>openOrder(id),150);
  };
}

        <div class="m">${KINDS[o.design.kind]} · ${PLACES[o.design.place].t} · ${o.design.tech} · ${o.design.cm} cm</div>
        ${o.hold?`<div class="hold">⚠ <span>Beklemede: ${esc(o.hold.reason)}</span></div>`:""}
        <span class="due ${d<=1&&s!=="hazir"?"late":""}">Teslim ${fmtDate(o.due)}${d<0?" · gecikti":d===0?" · bugün":d===1?" · yarın":""}</span>
        <div class="job-acts"><button class="btn sm" type="button" data-open="${o.id}">Detay</button>${shop?`<button class="btn sm primary" type="button" data-adv="${o.id}" ${o.hold?"disabled title=\"Sorun çözülünce ilerletebilirsiniz\"":""}>${s==="hazir"?"Teslim et":"→ "+STATUS[FLOW[FLOW.indexOf(s)+1]].short}</button>`:""}</div>

function advance(id){
  const o=S.orders.find(x=>x.id===id&&x.store===curStore());if(!o||o.hold)return;const i=FLOW.indexOf(o.status);if(i>=FLOW.length-1)return;
  o.status=FLOW[i+1];o.history.push([o.status,nowStamp()]);if(!S.seen.includes(id))S.seen.push(id);save();
  toast(`✓ <span><b class="mono">${id}</b> → ${STATUS[o.status].t}. ${esc(store().name)} bilgilendirildi.</span>`);
  const open=!!$("#layer").innerHTML;render();if(open)openOrder(id);
}
function postMsg(o,text,extra={}){
  const sd=side();o.messages.push({side:sd,name:me.name,text,at:nowStamp(),...extra});
  o.unread=o.unread||{store:0,ws:0};o.unread[sd==="store"?"ws":"store"]++;
}

  const p=prod(o.productId),shop=mode()==="shop",sd=side(),st=store();

      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <div class="garment-stage">${garment(p,o.design,"on",{guide:pl.side==="on"})}<span class="eyebrow" style="position:absolute;top:10px;left:12px">Ön</span></div>

      <div class="panel"><div class="panel-b"><dl class="spec">
        <dt>Müşteri</dt><dd>${esc(o.customer)}</dd>
        ${o.phone&&showPrice?`<dt>Telefon</dt><dd class="mono">${esc(o.phone)}</dd>`:""}

        <dt>Baskı türü</dt><dd>${KINDS[o.design.kind]}${o.design.kind==="yazi"?` · “${esc(o.design.text)}”`:""}</dd>
        <dt>Konum</dt><dd>${pl.t} · ${o.design.cm} cm genişlik</dd>
        <dt>Teknik</dt><dd>${esc(o.design.tech)}</dd>

        ${o.design.fileName?`<dt>Dosya</dt><dd class="mono">📎 ${esc(o.design.fileName)}</dd>`:""}

      ${o.note?`<div class="notice" style="margin-top:14px;background:var(--warn-soft);color:var(--warn)">Not: ${esc(o.note)}</div>`:""}</div></div>
      <div><h3 style="margin-bottom:10px">Mesajlar <span class="muted" style="font-weight:500;font-size:13px">· ${esc(st.name)} ↔ ${esc(st.ws)}</span></h3>
        <div class="thread" id="thread">${o.messages.length?o.messages.map(m=>m.sys?`<div class="msg sys">${esc(m.text)} · ${m.at}</div>`:`<div class="msg ${m.side===sd?"mine":""} ${m.issue?"issue":""}"><div class="mh"><b>${esc(m.name)}</b> · ${m.side==="ws"?esc(st.ws):esc(st.name)} · ${m.at}</div>${m.issue?"<b style=\"color:var(--bad)\">Sorun bildirimi</b><br>":""}${esc(m.text)}</div>`).join(""):`<p class="muted" style="font-size:13px">Henüz mesaj yok. Soru veya değişiklik için ${esc(other)}'ye buradan yazın; mesaj siparişle birlikte saklanır.</p>`}</div>
        <form class="msg-form" id="mf" style="margin-top:10px"><textarea class="input" id="mt" rows="2" placeholder="${esc(other)}'ye mesaj yazın"></textarea><button class="btn primary" type="submit">Gönder</button></form>
      </div>
      ${shop&&!o.hold&&o.status!=="teslim"?`<div id="repbox"><button class="btn" type="button" id="rep" style="width:100%;border-color:var(--bad);color:var(--bad)">⚠ Sorun bildir</button></div>`:""}
      <div><h3 style="margin-bottom:10px">Süreç</h3><div class="timeline">${FLOW.map((s,i)=>{const done=i<cur||o.status==="teslim";return `<div class="tl ${done?"done":i===cur?"cur":""}"><div class="dot">${done?"✓":""}</div><div><b>${STATUS[s].t}</b><small>${histMap[s]||"Bekliyor"}</small></div></div>`}).join("")}</div></div>
      ${shop&&o.status!=="teslim"?`<button class="btn primary" type="button" id="adv" ${o.hold?"disabled":""}>${o.hold?"Sorun çözülünce ilerletebilirsiniz":o.status==="hazir"?"Teslim edildi olarak işaretle":"Durumu ilerlet → "+STATUS[FLOW[cur+1]].t}</button>`:""}
      ${!shop?`<button class="btn" type="button" id="again">↻ Bu siparişi tekrar ver</button>`:""}
    </div>`);
  const reopen=()=>{render();openOrder(id)};
  $("#mf").onsubmit=e=>{e.preventDefault();const t=$("#mt").value.trim();if(!t)return;postMsg(o,t);save();reopen();toast(`💬 Mesaj ${esc(other)}'ye iletildi`)};
  const a=$("#adv");if(a)a.onclick=()=>advance(id);
  const ag=$("#again");if(ag)ag.onclick=()=>repeatOrder(id);
  const rp=$("#rep");if(rp)rp.onclick=()=>{
    let reason=ISSUES[0];
    $("#repbox").innerHTML=`<div class="issue-box"><b>Sorun bildir</b><div class="seg" id="rs">${ISSUES.map((r,i)=>`<button type="button" data-v="${i}" class="${i===0?"on":""}">${r}</button>`).join("")}</div>
      <textarea class="input" id="rt" rows="2" placeholder="Kısaca açıklayın: örn. logo 72 dpi, baskıda bulanık çıkar"></textarea>
      <div style="display:flex;gap:8px"><button class="btn primary" type="button" id="rsend">${esc(st.name)}'ya bildir ve işi beklet</button><button class="btn" type="button" id="rcancel">Vazgeç</button></div></div>`;
    $("#rs").querySelectorAll("button").forEach(b=>b.onclick=()=>{reason=ISSUES[+b.dataset.v];$("#rs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
    $("#rcancel").onclick=()=>openOrder(id);
    $("#rsend").onclick=()=>{const t=$("#rt").value.trim()||reason;o.hold={reason,by:me.name,at:nowStamp()};postMsg(o,t,{issue:true});save();reopen();toast(`⚠ <span>Sorun ${esc(st.name)}'ya bildirildi. <b class="mono">${id}</b> beklemede.</span>`)};
  };
  const rs=$("#resolve");if(rs)rs.onclick=()=>{const t=$("#mt").value.trim();o.hold=null;postMsg(o,t?("Sorun çözüldü: "+t):"Sorun çözüldü, işe devam edebilirsiniz.");save();reopen();toast(`✓ <span><b class="mono">${id}</b> atölyede yeniden açıldı</span>`)};
  const rf=$("#refile");if(rf)rf.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{o.design.file=r.result;o.design.fileName=f.name;o.messages.push({sys:true,text:`Yeni dosya yüklendi: ${f.name}`,at:nowStamp()});o.unread.ws++;save();reopen();toast("📎 Yeni dosya siparişe eklendi")};r.readAsDataURL(f)};
  if(opt.focusMsg){const mt=$("#mt");if(mt)mt.focus()}
  const th=$("#thread");if(th&&o.messages.length)th.lastElementChild.scrollIntoView({block:"nearest"});
}

// ---------------- Kullanıcılar ----------------
function viewUsers(v){
  const list=S.users.slice().sort((a,b)=>({admin:0,store:1,ws:2}[a.role]-{admin:0,store:1,ws:2}[b.role])||String(a.store).localeCompare(String(b.store)));
  v.innerHTML=topbar("Kullanıcılar","Her çalışan kendi kullanıcı adıyla girer ve yalnızca bağlı olduğu mağazayı veya atölyeyi görür.")+`
  <div class="scope-note"><span>ⓘ</span><span>Mağaza personeli kendi mağazasının stok, sipariş ve atölye durumunu görür. Atölye ustası yalnızca kendi atölyesinin iş emirlerini görür, fiyat ve stok göremez. Yönetici iki mağazayı da görür.</span></div>
  <div class="two">
    <div class="panel"><div class="panel-h"><h2>Hesaplar</h2><span class="muted mono" style="font-size:12px">${S.users.length} kişi</span></div>
      <div class="tbl-wrap"><table class="cards orders"><thead><tr><th>Ad</th><th>Kullanıcı adı</th><th>Rol</th><th>Erişim</th><th></th></tr></thead><tbody>
      ${list.map(u=>`<tr><td class="o-id"><div style="display:flex;gap:10px;align-items:center"><span class="av" style="width:30px;height:30px;font-size:12px">${esc(initials(u.name))}</span><b>${esc(u.name)}</b></div></td>
        <td class="mono c-full" data-label="Kullanıcı adı">${esc(u.u)}</td><td class="c-full" data-label="Rol">${roleChip(u.role)}</td><td class="c-full" data-label="Erişim">${esc(where(u))}</td>
        <td class="o-st">${u.u===me.u?`<span class="muted" style="font-size:12.5px">Siz</span>`:`<button class="btn sm" type="button" data-del="${esc(u.u)}">Sil</button>`}</td></tr>`).join("")}
      </tbody></table></div></div>
    <div class="panel"><div class="panel-h"><h2>Yeni kullanıcı</h2></div>
      <form class="panel-b stack" id="uf" autocomplete="off">
        <div class="field"><label for="un">Ad soyad</label><input class="input" id="un" required placeholder="Örn. Zeynep Arslan"></div>
        <div class="row">
          <div class="field"><label for="uu">Kullanıcı adı</label><input class="input mono" id="uu" required autocapitalize="none" spellcheck="false" placeholder="zeynep"></div>
          <div class="field"><label for="upw">Şifre</label><input class="input mono" id="upw" required placeholder="En az 4 karakter"></div>
        </div>
        <div class="field"><span class="lbl">Rol</span><div class="seg" id="urole"><button type="button" data-v="store" class="on">Mağaza personeli</button><button type="button" data-v="ws">Atölye ustası</button><button type="button" data-v="admin">Yönetici</button></div></div>
        <div class="field" id="ustore-f"><label for="ustore">Bağlı olduğu yer</label><select class="input" id="ustore"></select></div>
        <div id="uerr"></div>
        <button class="btn primary" type="submit">Kullanıcıyı ekle</button>
      </form></div>
  </div>`;
  let role="store";
  const syncStore=()=>{$("#ustore-f").hidden=role==="admin";$("#ustore").innerHTML=S.stores.map(s=>`<option value="${s.id}">${esc(role==="ws"?s.ws:s.name)}</option>`).join("")};
  $("#urole").querySelectorAll("button").forEach(b=>b.onclick=()=>{role=b.dataset.v;$("#urole").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));syncStore()});
  syncStore();
  $("#uf").onsubmit=e=>{e.preventDefault();
    const name=$("#un").value.trim(),u=$("#uu").value.trim().toLocaleLowerCase("tr"),pw=$("#upw").value;
    const err=m=>$("#uerr").innerHTML=`<div class="notice bad">${m}</div>`;
    if(!name||!u)return err("Ad ve kullanıcı adı gerekli.");
    if(!/^[a-z0-9._-]{3,20}$/.test(u))return err("Kullanıcı adı 3–20 karakter olmalı; harf, rakam, nokta veya tire kullanın (Türkçe karakter olmadan).");
    if(S.users.some(x=>x.u===u))return err("Bu kullanıcı adı zaten kullanılıyor.");
    if(pw.length<4)return err("Şifre en az 4 karakter olmalı.");
    S.users.push({u,p:pw,name,role,store:role==="admin"?null:$("#ustore").value});save();
    toast(`✓ ${esc(name)} eklendi · ${ROLES[role]}`);viewUsers(v);
  };
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Emin misiniz?";b.classList.add("primary");setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Sil";b.classList.remove("primary")}},3000);return}
    const u=S.users.find(x=>x.u===b.dataset.del);S.users=S.users.filter(x=>x!==u);save();toast(`${esc(u.name)} silindi`);viewUsers(v);
  });
}

// ---------------- Telefon: Diğer menüsü ----------------
function viewMenu(v){
  const items=[["musteriler","Müşteriler","musteri","Geçmiş siparişler, logolar, tekrar sipariş",0],["transferler","Şube transferi","transfer","Diğer şubeden ürün iste, gelen talepleri onayla",trBadge()]];
  if(me.role==="admin")items.push(["kullanicilar","Kullanıcılar","users","Çalışan hesapları ve yetkiler",0]);
  v.innerHTML=topbar("Diğer",esc(store().name))+`<div class="menu-grid">${items.map(([id,t,ic,s,b])=>`<a href="#${id}">${ICON[ic]}<b>${t}</b><span class="muted" style="font-size:13px">${s}</span>${b?`<span class="badge">${b}</span>`:""}</a>`).join("")}</div>`;
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLayer()});
$("#reset").onclick=e=>{
  const b=e.currentTarget;
  if(b.dataset.armed){S=seed();draft=null;save();delete b.dataset.armed;b.textContent="↺ Demo verisini sıfırla";me=S.users.find(x=>x.u===me.u)||null;render();toast("Demo verisi sıfırlandı.");return}
  b.dataset.armed="1";b.textContent="Emin misiniz? Tekrar tıklayın";setTimeout(()=>{if(b.dataset.armed){delete b.dataset.armed;b.textContent="↺ Demo verisini sıfırla"}},3000);
};
window.addEventListener("hashchange",()=>{closeLayer();render()});
render();
})();
</script>
</body></html>
