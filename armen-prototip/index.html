<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Armen Operasyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: operasyon paneli — açık kenar çubuğu + yapışkan üst bar + 1320px içerik; telefonda kenar çubuğu açılır menü olur */
:root{
  --bg:#F7F7F5; --panel:#FFFFFF; --subtle:#F2F1EE; --hover:#ECEBE7; --line:#E5E3DE; --line-2:#D4D1CA;
  --text:#1C1B19; --text-2:#57534E; --text-3:#8C877F;
  --brand:#8A1C3E; --brand-2:#6E1631; --brand-soft:#F7EAEF; --brand-line:#E8C9D4;
  --primary:#1C1B19; --primary-ink:#FFFFFF; --primary-hover:#3A3834;
  --green:#15803D; --green-soft:#EAF6EE; --amber:#B45309; --amber-soft:#FCF3E3; --red:#B91C1C; --red-soft:#FCECEB; --blue:#1D4ED8; --blue-soft:#ECF1FD; --violet:#6D28D9; --violet-soft:#F2EDFC;
  --garment-bg:#F2F1EE; --dot:#DDDAD3;
  --shadow-1:0 1px 2px rgba(28,27,25,.05); --shadow-2:0 8px 28px rgba(28,27,25,.10),0 2px 6px rgba(28,27,25,.06);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111110; --panel:#191918; --subtle:#1F1E1D; --hover:#262523; --line:#2C2B28; --line-2:#3B3936;
  --text:#EDEDEB; --text-2:#B4B1AA; --text-3:#85817A;
  --brand:#E2708F; --brand-2:#F08DA8; --brand-soft:#33171F; --brand-line:#5A2A38;
  --primary:#EDEDEB; --primary-ink:#111110; --primary-hover:#D4D3CF;
  --green:#4ADE80; --green-soft:#132519; --amber:#FBBF24; --amber-soft:#2B2210; --red:#F87171; --red-soft:#2E1615; --blue:#7DA3FF; --blue-soft:#161F35; --violet:#B79BFF; --violet-soft:#221A38;
  --garment-bg:#1F1E1D; --dot:#33312E;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111110; --panel:#191918; --subtle:#1F1E1D; --hover:#262523; --line:#2C2B28; --line-2:#3B3936;
  --text:#EDEDEB; --text-2:#B4B1AA; --text-3:#85817A;
  --brand:#E2708F; --brand-2:#F08DA8; --brand-soft:#33171F; --brand-line:#5A2A38;
  --primary:#EDEDEB; --primary-ink:#111110; --primary-hover:#D4D3CF;
  --green:#4ADE80; --green-soft:#132519; --amber:#FBBF24; --amber-soft:#2B2210; --red:#F87171; --red-soft:#2E1615; --blue:#7DA3FF; --blue-soft:#161F35; --violet:#B79BFF; --violet-soft:#221A38;
  --garment-bg:#1F1E1D; --dot:#33312E;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.t2{color:var(--text-2)} .t3{color:var(--text-3)}
.sm{font-size:12.5px}
.i{flex:none;display:block}

/* ---------- Kabuk ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.sb{position:sticky;top:0;height:100vh;background:var(--subtle);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;z-index:30}
.sb-in{display:flex;flex-direction:column;gap:2px;padding:14px 10px;height:100%;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font:600 15px var(--font);flex:none}
.brand b{font-size:15px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;font-size:11.5px;color:var(--text-3);margin-top:-1px}
.ws{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:8px 10px;margin-bottom:6px;box-shadow:var(--shadow-1)}
.ws .grow{flex:1;min-width:0}
.ws b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws small{display:block;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft);flex:none}
button.ws:hover{border-color:var(--line-2)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--hover);border-radius:var(--r-sm);padding:2px;margin-bottom:8px}
.seg2 button{border:0;background:transparent;border-radius:5px;padding:5px 6px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.seg2 button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-1)}
.nav-l{font-size:11.5px;font-weight:500;color:var(--text-3);padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);text-decoration:none;color:var(--text-2);font-weight:500;font-size:13.5px;position:relative}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line)}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav a .i{color:var(--text-3)} .nav a.on .i{color:var(--text)}
.cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--hover);color:var(--text-2);font:500 11.5px var(--mono);display:inline-grid;place-items:center}
.cnt.hot{background:var(--brand);color:#fff}
.sb-foot{margin-top:auto;padding-top:12px;display:grid;gap:8px}
.demo{font-size:12px;color:var(--text-3);padding:10px;border:1px dashed var(--line-2);border-radius:var(--r-sm);display:grid;gap:6px}
.demo b{color:var(--text-2);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--text-2);font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:2px;justify-self:start}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-sm)}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;border:1px solid var(--brand-line)}
.me .grow{flex:1;min-width:0}
.me b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{display:block;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--text-2);position:relative;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn .pip{position:absolute;top:2px;right:1px;min-width:16px;height:16px;border-radius:8px;background:var(--brand);color:#fff;font:600 10px var(--mono);display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}

.main{min-width:0;display:flex;flex-direction:column}
.tb{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:12px;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.crumb{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-3);min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{position:relative;width:280px}
.search input{width:100%;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:0 34px 0 32px;font-size:13.5px}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search .i{position:absolute;left:10px;top:9.5px;color:var(--text-3)}
.search kbd{position:absolute;right:8px;top:8px;font:500 11px var(--mono);color:var(--text-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--subtle)}
.menu-btn,.search-ic{display:none}
.content{width:100%;max-width:1320px;margin:0 auto;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:22px}
.ph p{color:var(--text-2);margin-top:4px;max-width:72ch}
.ph-a{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Bileşenler ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:52px;flex-wrap:wrap}
.card-h h2{font-size:14px}
.card-h .sub{font-size:12.5px;color:var(--text-3);font-weight:400}
.card-b{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--panel);color:var(--text);font-size:13.5px;font-weight:500;white-space:nowrap;text-decoration:none;box-shadow:var(--shadow-1)}
.btn:hover{background:var(--subtle)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.btn.danger:hover{background:var(--red-soft)}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.s{height:28px;padding:0 9px;font-size:12.5px}
.btn.w{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.bd{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.bd i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.bd.blue{color:var(--blue);background:var(--blue-soft)}
.bd.amber{color:var(--amber);background:var(--amber-soft)}
.bd.violet{color:var(--violet);background:var(--violet-soft)}
.bd.green{color:var(--green);background:var(--green-soft)}
.bd.gray{color:var(--text-2);background:var(--subtle);border-color:var(--line)}
.bd.red{color:var(--red);background:var(--red-soft)}
.bd.brand{color:var(--brand);background:var(--brand-soft)}
.msgc{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--mono);color:var(--blue)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line-2);flex:none;vertical-align:-1px}
.input,select.input,textarea.input{width:100%;min-width:0;height:36px;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);padding:0 11px;font-size:14px;box-shadow:var(--shadow-1)}
textarea.input{height:auto;min-height:76px;padding:9px 11px;resize:vertical;line-height:1.45}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input::placeholder,textarea::placeholder{color:var(--text-3)}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:500;color:var(--text-2)}
.hint{font-size:12.5px;color:var(--text-3)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--subtle);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;border-radius:5px;height:28px;padding:0 10px;font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-1),0 0 0 1px var(--line)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{height:32px;padding:0 12px;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--text-2)}
.opt:hover{border-color:var(--text-3);color:var(--text)}
.opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--text-2)}
.check input{width:16px;height:16px;accent-color:var(--brand)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-sm);padding:10px 12px;font-size:13px;border:1px solid}
.alert .i{margin-top:1px}
.alert b{font-weight:600}
.alert.red{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 25%,transparent)}
.alert.green{background:var(--green-soft);color:var(--green);border-color:color-mix(in srgb,var(--green) 25%,transparent)}
.alert.amber{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 25%,transparent)}
.alert.blue{background:var(--blue-soft);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 25%,transparent)}
.alert .grow{flex:1;min-width:0}
.alert .t2{color:inherit;opacity:.85}
.empty{display:grid;place-items:center;gap:8px;text-align:center;padding:28px 16px;color:var(--text-3);font-size:13px}
.divider{height:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:9px 16px;font-size:13.5px;margin:0}
.kv dt{color:var(--text-3)}
.kv dd{margin:0;text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}

/* Tablolar */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:500;color:var(--text-3);text-align:left;padding:9px 14px;background:var(--subtle);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--subtle)}
td .strong,.strong{font-weight:500;color:var(--text)}
td .sub{display:block;font-size:12.5px;color:var(--text-3)}
.ta-r{text-align:right}
.idc{font:500 13px var(--mono);color:var(--text)}
th.sz,td.sz{text-align:center;width:62px;padding-left:4px;padding-right:4px}
td.sz input{width:52px;height:30px;text-align:center;border:1px solid transparent;background:transparent;border-radius:6px;font:500 13px var(--mono);color:var(--text)}
td.sz input:hover{border-color:var(--line-2);background:var(--panel)}
td.sz input:focus{outline:none;border-color:var(--brand);background:var(--panel);box-shadow:0 0 0 3px var(--brand-soft)}
td.sz.low input{color:var(--amber);background:var(--amber-soft)}
td.sz.zero input{color:var(--red);background:var(--red-soft)}
.meter{height:6px;border-radius:3px;background:var(--subtle);border:1px solid var(--line);overflow:hidden;width:96px}
.meter i{display:block;height:100%;border-radius:3px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.search-in{position:relative;flex:0 1 260px;min-width:180px}
.search-in .i{position:absolute;left:10px;top:10px;color:var(--text-3)}
.search-in .input{padding-left:32px;height:34px}
.toolbar .sp{flex:1}

/* Genel bakış */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px}
.kpi .l{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.kpi .l .i{color:var(--text-3)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .d{font-size:12.5px;color:var(--text-3);margin-top:2px}
.kpi.warn .v{color:var(--red)}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.inbox-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--text-3)}
.inbox-row:last-child{border-bottom:0}
.inbox-row:hover{background:var(--subtle)}
.ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.inbox-row .grow{flex:1;min-width:0}
.inbox-row b{display:block;font-size:13.5px;font-weight:500;color:var(--text)}
.inbox-row span.s{display:block;font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic.red{background:var(--red-soft);color:var(--red)} .ic.blue{background:var(--blue-soft);color:var(--blue)} .ic.amber{background:var(--amber-soft);color:var(--amber)} .ic.green{background:var(--green-soft);color:var(--green)}
.pipe-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--subtle);gap:2px}
.pipe-bar i{display:block;height:100%}
.pipe-leg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.pipe-leg a{text-decoration:none;display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm)}
.pipe-leg a:hover{background:var(--subtle)}
.pipe-leg b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pipe-leg span{font-size:12px;color:var(--text-3)}
.pipe-leg .k{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2)}
.pipe-leg .k i{width:8px;height:8px;border-radius:2px;display:block}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow.click{cursor:pointer}
.lrow.click:hover{background:var(--subtle)}
.lrow .grow{flex:1;min-width:0}
.lrow b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .s{display:block;font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lab{fill:var(--text-3);font:500 11px var(--mono)}
.chart .val{fill:var(--text-2);font:500 11px var(--mono)}
.chart .bar{fill:var(--line-2)}
.chart .bar.today{fill:var(--brand)}

/* Ürün görseli */
.thumb{width:40px;height:44px;border-radius:6px;background:var(--garment-bg);border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden}
.thumb svg{width:88%;height:88%}
.stage{border-radius:var(--r-sm);border:1px solid var(--line);background-color:var(--garment-bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:14px 14px;display:grid;place-items:center;padding:14px;position:relative}

function isDark(hex){const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000<110}
function garment(p,design,sd,opts={}){
  const hex=p?p.hex:"#F7F6F2",cat=p?p.cat:"tisort",dark=isDark(hex);
  const body=cat==="hoodie"||cat==="sweat"
   ?"M118 28 L58 56 L18 210 L60 222 L92 120 L92 380 L268 380 L268 120 L300 222 L342 210 L302 56 L242 28 Q180 62 118 28 Z"
   :"M118 26 L60 52 L20 122 L70 146 L92 116 L92 380 L268 380 L268 116 L290 146 L340 122 L300 52 L242 26 Q180 64 118 26 Z";
  const stroke=dark?"rgba(255,255,255,.2)":"rgba(0,0,0,.18)";
  let extra="";
  if(cat==="hoodie") extra=sd==="on"
    ?`<path d="M128 30 Q180 110 232 30 Q214 4 180 2 Q146 4 128 30Z" fill="${hex}" stroke="${stroke}" stroke-width="2"/><path d="M168 66 L166 120 M192 66 L194 120" stroke="${stroke}" stroke-width="2"/><path d="M128 300 L232 300 L240 360 L120 360Z" fill="none" stroke="${stroke}" stroke-width="2"/>`
    :`<path d="M124 32 Q180 -18 236 32 Q236 70 180 84 Q124 70 124 32Z" fill="${hex}" stroke="${stroke}" stroke-width="2"/>`;
  else if(cat==="polo") extra=sd==="on"?`<path d="M150 34 L180 70 L210 34" fill="none" stroke="${stroke}" stroke-width="3"/><path d="M180 70 L180 120" stroke="${stroke}" stroke-width="2"/><circle cx="180" cy="86" r="2.5" fill="${stroke}"/><circle cx="180" cy="104" r="2.5" fill="${stroke}"/>`:"";
  else extra=sd==="on"?`<path d="M118 26 Q180 72 242 26" fill="none" stroke="${stroke}" stroke-width="5"/>`:`<path d="M126 30 Q180 46 234 30" fill="none" stroke="${stroke}" stroke-width="4"/>`;
  let art="";
  if(design&&PLACES[design.place]&&PLACES[design.place].side===sd){
    const pl=PLACES[design.place],w=Math.max(16,Math.min(pl.max,+design.cm||8))*PX_PER_CM,x=pl.x-w/2,y=pl.y-w/2;
    if(design.kind==="yazi"){const txt=design.text||"YAZI",fs=Math.min(w/Math.max(2,txt.length)*1.7,w*.55);
      art=`<text x="${pl.x}" y="${pl.y}" text-anchor="middle" dominant-baseline="middle" font-family="Geist, sans-serif" font-weight="700" font-size="${fs.toFixed(1)}" fill="${design.ink||"#111"}" letter-spacing="1">${esc(txt)}</text>`;}
    else if(design.file) art=`<image href="${design.file}" x="${x}" y="${y}" width="${w}" height="${w}" preserveAspectRatio="xMidYMid meet"/>`;
    else art=sampleMark(design,pl.x,pl.y,w);
    if(opts.guide) art+=`<rect x="${x-4}" y="${y-4}" width="${w+8}" height="${w+8}" rx="3" fill="none" stroke="#C2185B" stroke-width="1.25" stroke-dasharray="4 3"/><line x1="${x-4}" y1="${y+w+12}" x2="${x+w+4}" y2="${y+w+12}" stroke="#C2185B" stroke-width="1"/><text x="${pl.x}" y="${y+w+26}" text-anchor="middle" font-family="Geist Mono, monospace" font-size="11" fill="#C2185B">${(+design.cm||0)} cm</text>`;
  }
  return `<svg viewBox="0 0 360 400" role="img" aria-label="${esc((p?p.name+" "+p.color:"Ürün")+", "+(sd==="on"?"ön":"arka"))}"><path d="${body}" fill="${hex}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>${extra}${art}</svg>`;
}
function sampleMark(d,cx,cy,w){
  const r=w/2,ink=d.ink||"#1F2B4D",initial=esc((d.text||"A").trim().charAt(0).toLocaleUpperCase("tr"));
  if(d.kind==="desen"){let s=`<g><rect x="${cx-r}" y="${cy-r}" width="${w}" height="${w}" rx="${w*.12}" fill="${ink}"/>`;
    for(let i=0;i<4;i++)s+=`<circle cx="${cx}" cy="${cy}" r="${r*(.25+i*.18)}" fill="none" stroke="#F3D27A" stroke-width="${Math.max(1,w*.025)}"/>`;
    return s+`<text x="${cx}" y="${cy+r*.8}" text-anchor="middle" font-family="Geist, sans-serif" font-weight="700" font-size="${w*.16}" fill="#F7F6F2">${esc(d.text||"")}</text></g>`;}
  return `<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="${ink}"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-family="Geist, sans-serif" font-weight="700" font-size="${w*.5}" fill="${isDark(ink)?"#F7F6F2":"#1A1622"}">${initial}</text></g>`;
}

function openPop(anchor,html,o={},bind){
  closePop();const r=anchor.getBoundingClientRect(),w=Math.min(o.w||300,window.innerWidth-24);
  const p=document.createElement("div");p.className="pop";p.style.width=w+"px";
  let left=o.right?r.right-w:r.left;left=Math.max(12,Math.min(left,window.innerWidth-w-12));
  p.style.left=left+"px";p.style.top=(r.bottom+6)+"px";p.innerHTML=html;$("#popl").appendChild(p);
  const outside=e=>{if(!p.contains(e.target)&&!anchor.contains(e.target))closePop()};
  setTimeout(()=>document.addEventListener("mousedown",outside),0);
  p._off=()=>document.removeEventListener("mousedown",outside);
  if(bind)bind(p);return p;
}

function salesChart(vals){
  const W=440,H=190,pl=30,pb=26,pt=18,max=Math.max(...vals,1),step=max<=10?2:max<=25?5:10,top=Math.ceil(max/step)*step,bw=32,slot=(W-pl)/7;
  let g="";for(let v=0;v<=top;v+=step){const y=pt+(H-pt-pb)*(1-v/top);g+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text class="lab" x="${pl-8}" y="${y+4}" text-anchor="end">${v}</text>`}
  const lab=i=>i===6?"Bugün":["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"][shift(i-6).getDay()];
  vals.forEach((v,i)=>{const h=(H-pt-pb)*(v/top),x=pl+i*slot+(slot-bw)/2,y=H-pb-h;g+=`<rect class="bar ${i===6?"today":""}" x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="3"/><text class="val" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${v}</text><text class="lab" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${lab(i)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 7 günün satış adetleri">${g}</svg>`;
}

function viewStock(v){
  const cats={all:"Tümü",tisort:"Tişört",polo:"Polo",hoodie:"Kapüşonlu",sweat:"Sweatshirt"};
  v.innerHTML=ph("Stok",`${esc(store().name)} stoğu, beden bazında. Adedi düzeltmek için hücreye tıklayın; siparişler stoktan otomatik düşer.`,`<button class="btn" id="add-prod" type="button">${ic("plus",15)}Ürün ekle</button>`)+`
  <div class="card">
    <div class="toolbar"><div class="search-in">${ic("search",15)}<input class="input" id="q" placeholder="Ürün veya renk ara" value="${esc(filter.q)}" aria-label="Ürün ara"></div>
      <div class="seg" id="cats">${Object.entries(cats).map(([k,l])=>`<button type="button" data-cat="${k}" class="${filter.cat===k?"on":""}">${l}</button>`).join("")}</div>
      <span class="sp"></span><label class="check"><input type="checkbox" id="lowonly" ${filter.low?"checked":""}>Sadece kritik</label></div>
    <div class="tw"><table class="cards"><thead><tr><th>Ürün</th>${SIZES.map(z=>`<th class="sz">${z}</th>`).join("")}<th class="ta-r">Toplam</th><th>Doluluk</th><th class="ta-r">Fiyat</th><th></th></tr></thead><tbody id="sbody"></tbody></table></div>
  </div>
  <p class="hint" style="margin-top:10px">Turuncu: minimum seviyenin yarısının altında. Kırmızı: tükendi. Diğer şubedeki adedi görmek veya ürün istemek için “Şubeler” düğmesini kullanın.</p>`;
  const body=$("#sbody");
  function rows(){
    const q=filter.q.toLocaleLowerCase("tr");
    const list=S.products.filter(p=>(filter.cat==="all"||p.cat===filter.cat)&&(!q||(p.name+" "+p.color).toLocaleLowerCase("tr").includes(q))&&(!filter.low||SIZES.some(z=>isLow(p,z))));
    body.innerHTML=list.length?list.map(p=>{const s=stk(p),t=stockTotal(p),pct=Math.min(1,t/(p.min*5*SIZES.length));
      return `<tr><td class="c-full"><div style="display:flex;align-items:center;gap:10px"><span class="sw" style="background:${p.hex};width:14px;height:14px"></span><span><span class="strong">${esc(p.name)}</span><span class="sub">${esc(p.color)}</span></span></div></td>
      ${SIZES.map(z=>{const n=s[z],c=n===0?"zero":isLow(p,z)?"low":"";return `<td class="sz ${c}" data-l="${z}"><input id="st-${p.id}-${z}" type="number" min="0" inputmode="numeric" value="${n}" data-p="${p.id}" data-z="${z}" aria-label="${esc(p.name+" "+p.color+" "+z)}"></td>`}).join("")}
      <td class="ta-r mono c-2" data-l="Toplam">${t}</td><td data-l="Doluluk"><div class="meter"><i style="width:${pct*100}%;background:${pct<.25?"var(--red)":pct<.5?"var(--amber)":"var(--green)"}"></i></div></td><td class="ta-r mono c-2" data-l="Fiyat">${fmtTL(p.price)}</td>
      <td class="ta-r c-full"><button class="btn s" type="button" data-br="${p.id}">${ic("swap",14)}Şubeler</button></td></tr>`}).join("")
      :`<tr><td colspan="11" class="c-full"><div class="empty">${ic("search",20)}Filtreye uyan ürün yok.</div></td></tr>`;
    body.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{const p=prod(inp.dataset.p);stk(p)[inp.dataset.z]=Math.max(0,parseInt(inp.value)||0);save();rows();refreshChrome();
      toast("check",`${esc(p.name)} ${esc(p.color)} ${inp.dataset.z}: <span class="mono">${stk(p)[inp.dataset.z]}</span> adet`)});
    body.querySelectorAll("[data-br]").forEach(b=>b.onclick=()=>openBranch(b.dataset.br));
  }
  rows();
  $("#q").oninput=e=>{filter.q=e.target.value;rows()};
  $("#lowonly").onchange=e=>{filter.low=e.target.checked;rows()};
  $("#cats").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter.cat=b.dataset.cat;$("#cats").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));rows()});
  $("#add-prod").onclick=openAddProduct;
}
function openAddProduct(){
  sheet("Ürün ekle",sheetTop("Stok · "+esc(store().name),"Yeni ürün"),`<form id="pf" class="stack">
      <div class="field"><label for="pn">Ürün adı</label><input class="input" id="pn" required value="Oversize Tişört"></div>
      <div class="row2"><div class="field"><label for="pc">Kategori</label><select class="input" id="pc"><option value="tisort">Tişört</option><option value="polo">Polo</option><option value="hoodie">Kapüşonlu</option><option value="sweat">Sweatshirt</option></select></div>
        <div class="field"><label for="pp">Satış fiyatı (₺)</label><input class="input mono" id="pp" type="number" min="0" value="349"></div></div>
      <div class="row2"><div class="field"><label for="pcol">Renk adı</label><input class="input" id="pcol" required value="Taş Mavisi"></div>
        <div class="field"><label for="phex">Renk</label><input class="input" id="phex" type="color" value="#7D95B0" style="padding:3px"></div></div>
      <div class="field"><span class="lbl">${esc(store().name)} başlangıç stoğu</span><div class="sizes">${SIZES.map(z=>`<div class="sz-box"><div class="h"><b>${z}</b></div><input id="ps-${z}" type="number" min="0" value="20" aria-label="${z}"></div>`).join("")}</div><span class="hint">Ürün diğer şubenin kataloğuna 0 stokla eklenir.</span></div>
      <button class="btn primary" type="submit">Stoğa ekle</button></form>`,true);
  $("#pf").onsubmit=e=>{e.preventDefault();
    const zero=Object.fromEntries(SIZES.map(z=>[z,0])),stock=Object.fromEntries(S.stores.map(s=>[s.id,{...zero}]));
    stock[curStore()]=Object.fromEntries(SIZES.map(z=>[z,Math.max(0,+$("#ps-"+z).value||0)]));
    const p={id:"p"+Date.now(),name:$("#pn").value.trim(),cat:$("#pc").value,color:$("#pcol").value.trim(),hex:$("#phex").value,price:+$("#pp").value||0,min:8,stock};
    S.products.push(p);save();closeLayer();render();toast("check",`${esc(p.name)} · ${esc(p.color)} stoğa eklendi`)};
}

// ================= Şube transferi =================
function createTransfer(pid,qty,note){
  const t={id:"TR-"+(S.trSeq++),product:pid,from:otherStore().id,to:curStore(),qty,status:"bekliyor",note,by:me.name,at:nowStamp(),log:[]};
  S.transfers.unshift(t);save();refreshChrome();toast("swap",`<b class="mono">${t.id}</b> ${esc(otherStore().name)}'a gönderildi · ${total(qty)} adet`);
}
function openBranch(pid,pre){
  const p=prod(pid),ms=store(),ot=otherStore(),mine=p.stock[ms.id],theirs=p.stock[ot.id],ask=pre||{};
  sheet("Şube stoğu",sheetTop("Şubeler arası stok",`${esc(p.name)} · ${esc(p.color)}`),`<div class="stack">
    <div class="card"><div class="tw"><table class="branch"><thead><tr><th>Şube</th>${SIZES.map(z=>`<th>${z}</th>`).join("")}<th>Toplam</th></tr></thead><tbody>
      <tr><td><span class="strong">${esc(ms.name)}</span> <span class="t3">(siz)</span></td>${SIZES.map(z=>`<td class="mono">${mine[z]}</td>`).join("")}<td class="mono strong">${total(mine)}</td></tr>
      <tr><td><span class="strong">${esc(ot.name)}</span></td>${SIZES.map(z=>`<td class="mono">${theirs[z]}</td>`).join("")}<td class="mono strong">${total(theirs)}</td></tr></tbody></table></div></div>
    <div class="alert blue">${ic("info")}<span>Diğer şubenin yalnızca adetlerini görürsünüz; fiyat ve siparişleri görünmez.</span></div>
    <form id="tf" class="stack"><h3 style="font-size:14px">${esc(ot.name)}'dan transfer iste</h3>
      <div class="sizes">${SIZES.map(z=>`<div class="sz-box"><div class="h"><b>${z}</b><span>en fazla ${theirs[z]}</span></div><input id="tq-${z}" type="number" min="0" max="${theirs[z]}" value="${Math.min(ask[z]||0,theirs[z])}" aria-label="${z}"></div>`).join("")}</div>
      <div class="field"><label for="tn">Not</label><input class="input" id="tn" placeholder="Örn. Kuzey Kafe siparişi için" value="${esc(ask._note||"")}"></div>
      <div id="terr"></div>
      <button class="btn primary" type="submit">${ic("send",15)}Transfer talebi gönder</button>
      <span class="hint">${esc(ot.name)} onaylayınca ürün yola çıkar ve onların stoğundan düşer. Siz teslim aldığınızda stoğunuza eklenir.</span></form></div>`,true);
  $("#tf").onsubmit=e=>{e.preventDefault();
    const qty=Object.fromEntries(SIZES.map(z=>[z,Math.max(0,parseInt($("#tq-"+z).value)||0)])),over=SIZES.filter(z=>qty[z]>theirs[z]);
    if(!total(qty))return $("#terr").innerHTML=`<div class="alert red">${ic("warn")}<span>En az bir beden için adet girin.</span></div>`;
    if(over.length)return $("#terr").innerHTML=`<div class="alert red">${ic("warn")}<span>${esc(ot.name)}'da yeterli stok yok: ${over.join(", ")}</span></div>`;
    createTransfer(pid,qty,$("#tn").value.trim());closeLayer();if(route()==="transferler")render();
  };
}
function viewTransfers(v){
  const cur=curStore(),open=t=>t.status==="bekliyor"||t.status==="yolda";
  const lists={in:S.transfers.filter(t=>t.from===cur&&open(t)),out:S.transfers.filter(t=>t.to===cur&&open(t)),done:S.transfers.filter(t=>(t.from===cur||t.to===cur)&&!open(t))};
  const row=t=>{const p=prod(t.product),dirIn=t.from===cur,acts=[];
    if(dirIn&&t.status==="bekliyor")acts.push(`<button class="btn primary s" type="button" data-ok="${t.id}">${ic("check",14)}Onayla ve gönder</button>`,`<button class="btn s" type="button" data-no="${t.id}">Reddet</button>`);
    if(!dirIn&&t.status==="yolda")acts.push(`<button class="btn primary s" type="button" data-rcv="${t.id}">${ic("check",14)}Teslim aldım</button>`);
    if(!dirIn&&t.status==="bekliyor")acts.push(`<button class="btn s" type="button" data-cancel="${t.id}">Geri çek</button>`);
    return `<div class="tr-row"><span class="sw" style="background:${p.hex};width:28px;height:28px;border-radius:7px"></span>
      <div style="min-width:0;display:grid;gap:4px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="strong">${esc(p.name)} · ${esc(p.color)}</span>${bd(TRS[t.status].t,TRS[t.status].tone)}</div>
        <div class="t2 sm"><span class="mono">${t.id}</span> · ${esc(store(t.from).name)} → ${esc(store(t.to).name)} · <span class="mono">${total(t.qty)} adet (${qtyText(t.qty)})</span></div>
        ${t.note?`<div class="sm">“${esc(t.note)}”</div>`:""}
        <div class="t3 sm">Talep eden ${esc(t.by)} · ${t.at}${t.log.map(l=>` · ${esc(l[0])}, ${l[1]}`).join("")}</div><div id="err-${t.id}"></div></div>
      <div class="tr-acts">${acts.join("")}</div></div>`};
  const L=lists[trTab];
  v.innerHTML=ph("Şube transferi",`${esc(store().name)} ile ${esc(otherStore().name)} arasındaki ürün talepleri.`,`<a class="btn" href="#stok">${ic("plus",15)}Stoktan talep aç</a>`)+`
  <div class="card"><div class="toolbar"><div class="seg" id="trt">
    <button type="button" data-k="in" class="${trTab==="in"?"on":""}">Bizden istenenler${lists.in.length?` · ${lists.in.length}`:""}</button>
    <button type="button" data-k="out" class="${trTab==="out"?"on":""}">Taleplerimiz${lists.out.length?` · ${lists.out.length}`:""}</button>
    <button type="button" data-k="done" class="${trTab==="done"?"on":""}">Geçmiş</button></div></div>
    ${L.length?L.map(row).join(""):`<div class="empty">${ic("swap",20)}${trTab==="in"?esc(otherStore().name)+"'dan bekleyen talep yok.":trTab==="out"?"Açık talebiniz yok. Stok ekranındaki “Şubeler” düğmesiyle talep açabilirsiniz.":"Tamamlanan transfer yok."}</div>`}</div>`;
  v.querySelectorAll("#trt button").forEach(b=>b.onclick=()=>{trTab=b.dataset.k;viewTransfers(v)});
  const T=id=>S.transfers.find(t=>t.id===id);
  v.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{const t=T(b.dataset.ok),s=prod(t.product).stock[t.from],short=SIZES.filter(z=>t.qty[z]>s[z]);
    if(short.length){$("#err-"+t.id).innerHTML=`<div class="alert red" style="margin-top:6px">${ic("warn")}<span>Stok yetmiyor: ${short.map(z=>z+" (elde "+s[z]+")").join(", ")}</span></div>`;return}
    SIZES.forEach(z=>s[z]-=t.qty[z]);t.status="yolda";t.log.push(["Gönderildi · "+me.name,nowStamp()]);save();render();toast("truck",`<b class="mono">${t.id}</b> gönderildi · ${total(t.qty)} adet stoğunuzdan düştü`)});
  v.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{const t=T(b.dataset.no);t.status="red";t.log.push(["Reddedildi · "+me.name,nowStamp()]);save();render();toast("x",`${t.id} reddedildi`)});
  v.querySelectorAll("[data-rcv]").forEach(b=>b.onclick=()=>{const t=T(b.dataset.rcv),s=prod(t.product).stock[t.to];SIZES.forEach(z=>s[z]+=t.qty[z]);t.status="tamam";t.log.push(["Teslim alındı · "+me.name,nowStamp()]);save();render();toast("check",`<b class="mono">${t.id}</b> teslim alındı · ${total(t.qty)} adet stoğa eklendi`)});
  v.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{S.transfers=S.transfers.filter(t=>t.id!==b.dataset.cancel);save();render();toast("x","Talep geri çekildi")});
}

// ================= Müşteriler =================
function viewCustomers(v){
  const all=customers();
  v.innerHTML=ph("Müşteriler",`${esc(store().name)} müşterileri. Geçmiş siparişler ve baskılar tek yerde; tek tıkla tekrar sipariş.`)+`
  <div class="card"><div class="toolbar"><div class="search-in">${ic("search",15)}<input class="input" id="cq" placeholder="Ad veya telefon ara" value="${esc(custQ)}" aria-label="Müşteri ara"></div><span class="sp"></span><span class="t3 sm">${all.length} müşteri</span></div>
  <div class="tw"><table class="cards list"><thead><tr><th>Müşteri</th><th>Telefon</th><th class="ta-r">Sipariş</th><th class="ta-r">Parça</th><th>Son sipariş</th><th></th></tr></thead><tbody id="cbody"></tbody></table></div></div>`;
  function rows(){
    const q=custQ.toLocaleLowerCase("tr"),qd=custQ.replace(/\D/g,"");
    const list=all.filter(c=>!q||c.name.toLocaleLowerCase("tr").includes(q)||(qd.length>=3&&(c.phone||"").replace(/\D/g,"").includes(qd)));
    $("#cbody").innerHTML=list.length?list.map(c=>{const last=c.orders[0];return `<tr class="click" data-c="${esc(c.key)}">
      <td class="a1"><div style="display:flex;gap:10px;align-items:center"><span class="av">${esc(initials(c.name))}</span><span class="strong">${esc(c.name)}</span></div></td>
      <td class="mono c-full" data-l="Telefon">${esc(c.phone||"—")}</td><td class="ta-r mono c-2" data-l="Sipariş">${c.orders.length}</td><td class="ta-r mono c-3" data-l="Parça">${c.orders.reduce((a,o)=>a+total(o.qty),0)}</td>
      <td class="c-full" data-l="Son sipariş"><span class="mono">${last.id}</span> <span class="t3">· ${fmtDate(last.created)} · ${KINDS[last.design.kind]}, ${PLACES[last.design.place].t.toLocaleLowerCase("tr")}</span></td>
      <td class="ta-r a2"><button class="btn s" type="button" data-rep="${last.id}">${ic("repeat",14)}Tekrar ver</button></td></tr>`}).join(""):`<tr><td colspan="6" class="c-full"><div class="empty">${ic("search",20)}Aramaya uyan müşteri yok.</div></td></tr>`;
    $("#cbody").querySelectorAll("[data-c]").forEach(r=>r.onclick=e=>{if(e.target.closest("[data-rep]"))return;openCustomer(r.dataset.c)});
    $("#cbody").querySelectorAll("[data-rep]").forEach(b=>b.onclick=e=>{e.stopPropagation();repeatOrder(b.dataset.rep)});
  }
  rows();$("#cq").oninput=e=>{custQ=e.target.value;rows()};
}
function openCustomer(key){
  const c=customers().find(x=>x.key===key);if(!c)return;
  const pcs=c.orders.reduce((a,o)=>a+total(o.qty),0),spent=c.orders.reduce((a,o)=>a+total(o.qty)*prod(o.productId).price,0);
  const designs=[],seenD=new Set();c.orders.forEach(o=>{const k=o.design.kind+o.design.text+o.design.place+o.productId;if(!seenD.has(k)){seenD.add(k);designs.push(o)}});
  sheet("Müşteri kartı",sheetTop("Müşteri · "+esc(store().name),esc(c.name),c.phone?`<span class="t2 mono sm">${esc(c.phone)}</span>`:"",`<button class="btn primary" type="button" data-rep="${c.orders[0].id}">${ic("repeat",15)}Son siparişi tekrarla</button>`),`<div class="stack">
    <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr));margin:0">
      <div class="card kpi"><div class="l">Sipariş</div><div class="v">${c.orders.length}</div></div>
      <div class="card kpi"><div class="l">Parça</div><div class="v">${pcs}</div></div>
      <div class="card kpi"><div class="l">Toplam tutar</div><div class="v" style="font-size:19px">${fmtTL(spent)}</div></div></div>
    <div><div class="sec-t">Kayıtlı baskılar</div><div class="logo-grid">${designs.map(o=>`<div title="${esc(KINDS[o.design.kind]+" · "+PLACES[o.design.place].t)}">${thumb(o)}</div>`).join("")}</div></div>
    <div><div class="sec-t">Sipariş geçmişi</div><div class="card">${c.orders.map(o=>{const p=prod(o.productId);return `<div class="lrow">${thumb(o)}<div class="grow"><b><span class="mono">${o.id}</span> · ${fmtDate(o.created)}</b><span class="s">${total(o.qty)} × ${esc(p.name)} ${esc(p.color)} · ${KINDS[o.design.kind]}, ${PLACES[o.design.place].t.toLocaleLowerCase("tr")}</span></div><div style="display:grid;gap:6px;justify-items:end">${stBadge(o.status)}<button class="btn s" type="button" data-rep="${o.id}">${ic("repeat",14)}Tekrar ver</button></div></div>`}).join("")}</div></div></div>`,true);
  $("#layer").querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>repeatOrder(b.dataset.rep));
}
function draftFrom(o){const d=newDraft();Object.assign(d,{customer:o.customer,phone:o.phone,productId:o.productId,qty:{...o.qty},kind:o.design.kind,place:o.design.place,tech:o.design.tech,cm:o.design.cm,text:o.design.text,ink:o.design.ink,file:o.design.file,fileName:o.design.fileName,note:o.note,side:PLACES[o.design.place].side,repeatOf:o.id});return d}
function repeatOrder(id){const o=S.orders.find(x=>x.id===id&&x.store===curStore());if(!o)return;draft=draftFrom(o);closeLayer();go("yeni-siparis");toast("repeat",`<b class="mono">${o.id}</b> kopyalandı · bedenleri ve tarihi kontrol edin`)}

// ================= Siparişler =================
function viewOrders(v){
  const tabs={all:"Tümü",acik:"Açık",dikkat:"Dikkat",...Object.fromEntries(FLOW.map(s=>[s,STATUS[s].s]))};
  const list=myOrders().filter(o=>orderFilter==="all"||(orderFilter==="acik"?o.status!=="teslim":orderFilter==="dikkat"?(o.hold||unreadOf(o)):o.status===orderFilter));
  v.innerHTML=ph("Siparişler",`${esc(store().name)} siparişleri. Her sipariş baskı detaylarıyla ${esc(store().ws)}'ye iletilir.`)+`

  <div class="tw"><table class="cards list"><thead><tr><th>Sipariş</th><th>Müşteri</th><th>Ürün</th><th class="ta-r">Adet</th><th>Baskı</th><th>Teslim</th><th>Durum</th></tr></thead><tbody>
  ${list.length?list.map(o=>{const p=prod(o.productId),d=daysLeft(o.due),late=d<=1&&o.status!=="teslim"&&o.status!=="hazir";return `<tr class="click" data-open="${o.id}">
    <td class="a1"><span class="idc">${o.id}</span></td><td class="c-full"><span class="strong">${esc(o.customer)}</span></td>
    <td class="c-full" data-l="Ürün"><div style="display:flex;gap:10px;align-items:center">${thumb(o)}<span>${esc(p.name)}<span class="sub">${esc(p.color)}</span></span></div></td>
    <td class="ta-r mono c-full" data-l="Adet">${total(o.qty)}<span class="sub">${qtyText(o.qty)}</span></td>
    <td data-l="Baskı" class="c-3">${KINDS[o.design.kind]} · ${PLACES[o.design.place].t}<span class="sub">${o.design.tech} · ${o.design.cm} cm</span></td>
    <td data-l="Teslim" class="c-2"><span class="due ${late?"late":""}">${fmtDate(o.due)}</span></td>
    <td class="a2"><div style="display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap">${msgBadge(o)}${statusCell(o)}</div></td></tr>`}).join(""):`<tr><td colspan="7" class="c-full"><div class="empty">${ic("list",20)}Bu filtrede sipariş yok.</div></td></tr>`}
  </tbody></table></div></div>`;
  v.querySelectorAll("#ot button").forEach(b=>b.onclick=()=>{orderFilter=b.dataset.k;viewOrders(v)});
  v.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{sheetTab="detay";openOrder(el.dataset.open)});
}

// ================= Yeni sipariş =================
function newDraft(){return {store:curStore(),customer:"",phone:"",productId:"p1",qty:{S:0,M:0,L:0,XL:0,XXL:0},kind:"logo",place:"gogus-sol",tech:"DTF baskı",cm:9,text:"",ink:"#1F2B4D",file:null,fileName:null,due:day(7),note:"",side:"on",repeatOf:null}}
function viewNew(v){
  if(!draft||draft.store!==curStore())draft=newDraft();
  const d=draft,st=store(),ot=otherStore(),groups={};S.products.forEach(p=>{(groups[p.name]=groups[p.name]||[]).push(p)});
  v.innerHTML=ph("Yeni sipariş",`Kaydedince ${esc(st.name)} stoğu düşer ve iş emri baskı detaylarıyla ${esc(st.ws)}'ye gider.`)+`
  ${d.repeatOf?`<div class="banner"><span class="l">${ic("repeat",16)}<span><b class="mono">${d.repeatOf}</b> siparişinden kopyalandı. Ürün, bedenler, dosya ve baskı ayarları hazır.</span></span><button class="btn s" type="button" id="clr">Boş forma dön</button></div>`:""}
  <form id="of" class="order-grid" novalidate>
    <div class="stack">
      <div class="card"><div class="card-h"><div class="step"><span class="n">1</span><h2>Müşteri</h2></div></div><div class="card-b stack">
        <div class="row2"><div class="field"><label for="cust">Müşteri veya firma adı</label><input class="input" id="cust" placeholder="Örn. Kuzey Kafe" value="${esc(d.customer)}" autocomplete="off"></div>
          <div class="field"><label for="phone">Telefon</label><input class="input mono" id="phone" inputmode="tel" placeholder="05xx xxx xx xx" value="${esc(d.phone)}" autocomplete="off"></div></div>
        <div id="ch" class="sugg"></div></div></div>
      <div class="card"><div class="card-h"><div class="step"><span class="n">2</span><h2>Ürün ve beden</h2></div><span class="sub">${esc(st.name)} stoğu</span></div><div class="card-b stack">
        <div class="field"><label for="prod">Ürün ve renk</label><select class="input" id="prod">${Object.entries(groups).map(([n,ps])=>`<optgroup label="${esc(n)}">${ps.map(p=>`<option value="${p.id}" ${p.id===d.productId?"selected":""}>${esc(p.name)} · ${esc(p.color)} (${stockTotal(p)} adet)</option>`).join("")}</optgroup>`).join("")}</select></div>
        <div class="field"><span class="lbl">Beden dağılımı</span><div class="sizes" id="sizes"></div></div><div id="sm" class="stack" style="gap:8px"></div></div></div>
      <div class="card"><div class="card-h"><div class="step"><span class="n">3</span><h2>Baskı detayı</h2></div></div><div class="card-b stack">
        <div class="field"><span class="lbl">Baskı türü</span><div class="opts" id="kind">${Object.entries(KINDS).map(([k,l])=>`<button type="button" class="opt ${d.kind===k?"on":""}" data-v="${k}">${l}</button>`).join("")}</div></div>
        <div id="fb" class="stack" style="gap:14px"></div>
        <div class="field"><span class="lbl">Konum</span><div class="opts" id="place">${Object.entries(PLACES).map(([k,p])=>`<button type="button" class="opt ${d.place===k?"on":""}" data-v="${k}">${p.t}</button>`).join("")}</div></div>
        <div class="row2"><div class="field"><label for="tech">Baskı tekniği</label><select class="input" id="tech">${TECH.map(t=>`<option ${t===d.tech?"selected":""}>${t}</option>`).join("")}</select></div>
          <div class="field"><label for="cm">Genişlik (cm)</label><input class="input mono" id="cm" type="number" min="3" max="35" value="${d.cm}"></div></div>
        <div class="row2"><div class="field"><label for="ink">Baskı rengi</label><div style="display:flex;gap:8px"><input id="ink" type="color" value="${d.ink}" class="input" style="width:44px;padding:3px;flex:none"><input class="input mono" id="inkhex" value="${d.ink.toUpperCase()}" aria-label="Renk kodu"></div></div>
          <div class="field"><label for="due">Teslim tarihi</label><input class="input" id="due" type="date" min="${day(0)}" value="${d.due}"></div></div>
        <div class="field"><label for="note">Atölyeye not</label><textarea class="input" id="note" placeholder="Örn. logo yaka dikişinden 8 cm aşağı">${esc(d.note)}</textarea></div></div></div>
    </div>
    <div class="sticky stack">
      <div class="card"><div class="card-h"><h2>Önizleme</h2><div class="seg" id="side"><button type="button" data-v="on" class="${d.side==="on"?"on":""}">Ön</button><button type="button" data-v="arka" class="${d.side==="arka"?"on":""}">Arka</button></div></div>
        <div class="card-b stack"><div class="stage" id="stage"></div><dl class="kv" id="spec"></dl><div class="divider"></div>
          <button class="btn primary w" type="submit" id="send" style="height:38px">${ic("send",15)}Kaydet ve ${esc(st.ws)}'ye gönder</button>
          <span class="hint" style="text-align:center">İş emri yalnızca ${esc(st.ws)} ekranına düşer.</span></div></div>
    </div>
  </form>`;
  const P=()=>prod(d.productId),preview=()=>garment(P(),{kind:d.kind,place:d.place,cm:d.cm,text:d.text,ink:d.ink,file:d.file},d.side,{guide:true});
  const clr=$("#clr");if(clr)clr.onclick=()=>{draft=newDraft();viewNew(v)};
  function hints(){
    const box=$("#ch"),n=d.customer.trim().toLocaleLowerCase("tr"),phd=d.phone.replace(/\D/g,"");
    if(d.repeatOf||(n.length<2&&phd.length<4)){box.innerHTML="";return}
    const m=customers().filter(c=>(n.length>=2&&c.name.toLocaleLowerCase("tr").includes(n))||(phd.length>=4&&(c.phone||"").replace(/\D/g,"").includes(phd))).slice(0,3);
    const exact=m.find(c=>c.name===d.customer.trim()&&(c.phone||"")===d.phone.trim());
    box.innerHTML=m.map(c=>{const last=c.orders[0],p=prod(last.productId);return exact===c
      ?`<div class="sugg-row match">${thumb(last)}<span class="grow"><b>Kayıtlı müşteri · ${c.orders.length} sipariş</b><span class="s">Son: <span class="mono">${last.id}</span> · ${total(last.qty)} × ${esc(p.name)} ${esc(p.color)} · ${KINDS[last.design.kind]}, ${PLACES[last.design.place].t.toLocaleLowerCase("tr")}</span></span><button class="btn primary s" type="button" data-rep="${last.id}">${ic("repeat",14)}Tekrarla</button></div>`
      :`<button type="button" class="sugg-row" data-pick="${esc(c.key)}"><span class="av">${esc(initials(c.name))}</span><span class="grow"><b>${esc(c.name)}</b><span class="s">${esc(c.phone||"")} · ${c.orders.length} sipariş · son ${fmtDate(last.created)}</span></span><span class="t3 sm">Seç</span></button>`}).join("");
    box.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const c=customers().find(x=>x.key===b.dataset.pick);d.customer=c.name;d.phone=c.phone||"";$("#cust").value=d.customer;$("#phone").value=d.phone;hints();update()});
    box.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>{draft=draftFrom(S.orders.find(o=>o.id===b.dataset.rep));viewNew(v);toast("repeat","Son sipariş forma kopyalandı")});
  }
  function sizes(){const s=stk(P());
    $("#sizes").innerHTML=SIZES.map(z=>`<div class="sz-box ${(+d.qty[z]||0)>s[z]?"over":""}"><div class="h"><b>${z}</b><span>stok ${s[z]}</span></div><input id="q-${z}" type="number" min="0" inputmode="numeric" value="${d.qty[z]||0}" data-z="${z}" aria-label="${z} adet"></div>`).join("");
    $("#sizes").querySelectorAll("input").forEach(i=>i.oninput=()=>{d.qty[i.dataset.z]=Math.max(0,parseInt(i.value)||0);i.closest(".sz-box").classList.toggle("over",d.qty[i.dataset.z]>stk(P())[i.dataset.z]);update()});
  }
  function filebox(){const fb=$("#fb");
    if(d.kind==="yazi"){fb.innerHTML=`<div class="field"><label for="txt">Basılacak yazı</label><input class="input" id="txt" maxlength="24" placeholder="Örn. ATLAS SK" value="${esc(d.text)}"></div>`;$("#txt").oninput=e=>{d.text=e.target.value;update()};return}
    fb.innerHTML=`<div class="field"><span class="lbl">${d.kind==="logo"?"Logo dosyası":"Desen dosyası"}</span><div class="drop ${d.file||d.fileName?"has":""}"><span class="fi">${d.file?`<img src="${d.file}" alt="">`:ic(d.fileName?"clip":"upload",18)}</span>
      <span class="grow"><b>${d.fileName?esc(d.fileName):"Dosya yükleyin"}</b><span class="hint">${d.fileName&&d.repeatOf?"Önceki siparişteki dosya kullanılacak":"PNG, JPG veya SVG · şeffaf arka plan önerilir"}</span></span>
      <label class="btn s" for="file">${d.file||d.fileName?"Değiştir":"Dosya seç"}</label><input id="file" type="file" accept="image/*" hidden></div></div>
      ${!d.file?`<div class="field"><label for="mk">Önizleme etiketi</label><input class="input" id="mk" maxlength="14" placeholder="Dosya yoksa önizlemede görünecek kısa ad" value="${esc(d.text)}"></div>`:""}`;
    $("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{d.file=r.result;d.fileName=f.name;filebox();update()};r.readAsDataURL(f)};
    const mk=$("#mk");if(mk)mk.oninput=e=>{d.text=e.target.value;update()};
  }
  function update(){
    const p=P(),s=stk(p),pl=PLACES[d.place],os=p.stock[ot.id];
    if(pl.side!==d.side){d.side=pl.side;$("#side").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===d.side))}
    if(+d.cm>pl.max){d.cm=pl.max;$("#cm").value=pl.max}
    $("#stage").innerHTML=preview();
    const n=total(d.qty);
    $("#spec").innerHTML=`<dt>Müşteri</dt><dd>${esc(d.customer||"—")}</dd><dt>Ürün</dt><dd>${esc(p.name)} · ${esc(p.color)}</dd><dt>Adet</dt><dd class="mono">${n?n+" ("+qtyText(d.qty)+")":"—"}</dd><dt>Baskı</dt><dd>${KINDS[d.kind]} · ${pl.t}</dd><dt>Teknik</dt><dd>${esc(d.tech)} · ${d.cm} cm</dd><dt>Teslim</dt><dd>${fmtDate(d.due)}</dd><dt>Tutar</dt><dd class="mono">${fmtTL(n*p.price)}</dd>`;
    const over=SIZES.filter(z=>(+d.qty[z]||0)>s[z]);
    if(over.length){const need=Object.fromEntries(SIZES.map(z=>[z,Math.max(0,(+d.qty[z]||0)-s[z])])),can=over.every(z=>os[z]>=need[z]);
      $("#sm").innerHTML=`<div class="alert red">${ic("warn")}<span class="grow"><b>Stok yetersiz.</b> Eksik: ${over.map(z=>z+" "+need[z]).join(", ")}</span></div>
        <div class="alert ${can?"green":"amber"}">${ic("swap")}<span class="grow"><b>${esc(ot.name)}'da: ${over.map(z=>z+" "+os[z]+" adet").join(" · ")}</b><br><span class="t2">${can?"Eksik adetleri diğer şubeden isteyebilirsiniz.":"Diğer şubede de yeterli stok yok; bulunanı isteyebilirsiniz."}</span></span><button class="btn s" type="button" id="reqtr">Eksiği iste</button></div>`;
      $("#reqtr").onclick=()=>{const pre=Object.fromEntries(SIZES.map(z=>[z,Math.min(need[z],os[z])]));pre._note=(d.customer?d.customer+" siparişi için":"Sipariş için")+" eksik bedenler";openBranch(p.id,pre)};
    }else $("#sm").innerHTML=n?`<div class="alert green">${ic("check")}<span>Tüm bedenler stokta. Kayıtta ${n} adet düşülecek.</span></div>`:"";
    $("#send").disabled=!n||over.length>0;
  }
  sizes();filebox();update();hints();
  $("#cust").oninput=e=>{d.customer=e.target.value;e.target.style.borderColor="";hints();update()};
  $("#phone").oninput=e=>{d.phone=e.target.value;hints()};
  $("#prod").onchange=e=>{d.productId=e.target.value;sizes();update()};
  $("#kind").querySelectorAll("button").forEach(b=>b.onclick=()=>{d.kind=b.dataset.v;$("#kind").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));filebox();update()});
  $("#place").querySelectorAll("button").forEach(b=>b.onclick=()=>{d.place=b.dataset.v;$("#place").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));update()});
  $("#side").querySelectorAll("button").forEach(b=>b.onclick=()=>{d.side=b.dataset.v;$("#side").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));$("#stage").innerHTML=preview()});
  $("#tech").onchange=e=>{d.tech=e.target.value;update()};
  $("#cm").oninput=e=>{d.cm=Math.max(3,+e.target.value||3);update()};
  $("#ink").oninput=e=>{d.ink=e.target.value;$("#inkhex").value=d.ink.toUpperCase();update()};
  $("#inkhex").onchange=e=>{if(/^#[0-9a-f]{6}$/i.test(e.target.value)){d.ink=e.target.value;$("#ink").value=d.ink;update()}};
  $("#due").onchange=e=>{d.due=e.target.value||d.due;update()};
  $("#note").oninput=e=>d.note=e.target.value;
  $("#of").onsubmit=e=>{e.preventDefault();
    const p=P(),s=stk(p);if(!total(d.qty))return;
    if(!d.customer.trim()){$("#cust").focus();$("#cust").style.borderColor="var(--red)";toast("warn","Müşteri adını girin");return}
    SIZES.forEach(z=>s[z]-=(+d.qty[z]||0));
    const id="ARM-"+(S.seq[st.id]++);
    const o={id,store:st.id,customer:d.customer.trim(),phone:d.phone.trim(),productId:p.id,qty:{...d.qty},
      design:{kind:d.kind,place:d.place,tech:d.tech,cm:+d.cm,text:d.text,ink:d.ink,file:d.file,fileName:d.kind==="yazi"?null:(d.fileName||((d.text||"logo").toLowerCase().replace(/[^a-z0-9]+/g,"_")+".png"))},
      status:"yeni",created:day(0),due:d.due,note:d.note.trim(),history:[["yeni",nowStamp()]],messages:[],unread:{store:0,ws:0},hold:null};
    if(d.repeatOf)o.messages.push({sys:true,text:`${d.repeatOf} siparişinin tekrarı · aynı dosya ve baskı ayarları`,at:nowStamp()});
    S.orders.unshift(o);S.sales[st.id][6]+=total(o.qty);save();draft=null;
    toast("send",`<b class="mono">${id}</b> ${esc(st.ws)}'ye iletildi · ${total(o.qty)} adet stoktan düştü`);
    go("siparisler");setTimeout(()=>{sheetTab="detay";openOrder(id)},120);
  };
}

// ================= Atölye panosu =================
function viewWorkshop(v){
  const lanes=["yeni","baskida","kalite","hazir"],shop=mode()==="shop",st=store(),orders=myOrders();
  v.innerHTML=ph(shop?"İş emirleri":esc(st.ws)+" durumu",shop?`${esc(st.name)}'dan gelen işler. Sorun varsa işi açıp “Sorun bildir” deyin; mağaza anında görür.`:`${esc(st.ws)}'nin canlı görünümü. Durumu atölye ustası ilerletir.`)+`
  <div class="board">${lanes.map(s=>{const list=orders.filter(o=>o.status===s);return `<section class="lane"><div class="lane-h">${stBadge(s)}<span class="c">${list.length}</span></div>
    ${list.length?list.map(o=>{const p=prod(o.productId),d=daysLeft(o.due),fresh=s==="yeni"&&!S.seen.includes(o.id);return `<article class="job ${fresh&&shop?"fresh":""} ${o.hold?"held":""}">
      <div class="job-top">${thumb(o)}<div style="min-width:0"><div class="idl"><span class="idc">${o.id}</span>${fresh&&shop?bd("Yeni","blue"):""}${msgBadge(o)}</div><div class="t">${esc(o.customer)}</div><div class="m">${total(o.qty)} × ${esc(p.name)} · ${esc(p.color)}</div></div></div>
      <div class="m">${KINDS[o.design.kind]} · ${PLACES[o.design.place].t} · ${o.design.tech} · ${o.design.cm} cm</div>
      ${o.hold?`<div class="alert red" style="padding:7px 10px">${ic("pause",14)}<span>Beklemede: ${esc(o.hold.reason)}</span></div>`:""}
      <span class="due ${d<=1&&s!=="hazir"?"late":""}">${ic("cal",13)}${fmtDate(o.due)}${d<0?" · gecikti":d===0?" · bugün":d===1?" · yarın":""}</span>
      <div class="job-acts"><button class="btn s" type="button" data-open="${o.id}">Aç</button>${shop?`<button class="btn primary s" type="button" data-adv="${o.id}" ${o.hold?"disabled":""}>${s==="hazir"?"Teslim et":STATUS[FLOW[FLOW.indexOf(s)+1]].s} ${ic("arrow",13)}</button>`:""}</div></article>`}).join(""):`<div class="empty" style="padding:18px 8px">Bu aşamada iş yok.</div>`}</section>`}).join("")}</div>`;
  v.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{sheetTab="detay";openOrder(b.dataset.open)});
  v.querySelectorAll("[data-adv]").forEach(b=>b.onclick=()=>advance(b.dataset.adv));
}
function advance(id){
  const o=S.orders.find(x=>x.id===id&&x.store===curStore());if(!o||o.hold)return;const i=FLOW.indexOf(o.status);if(i>=FLOW.length-1)return;
  o.status=FLOW[i+1];o.history.push([o.status,nowStamp()]);if(!S.seen.includes(id))S.seen.push(id);save();
  toast("check",`<b class="mono">${id}</b> → ${STATUS[o.status].t} · ${esc(store().name)} bilgilendirildi`);
  const open=!!$("#layer").innerHTML;render();if(open)openOrder(id);
}
function postMsg(o,text,extra={}){const sd=side();o.messages.push({side:sd,name:me.name,text,at:nowStamp(),...extra});o.unread=o.unread||{store:0,ws:0};o.unread[sd==="store"?"ws":"store"]++}

// ================= Sipariş detayı =================
function openOrder(id){
  const o=S.orders.find(x=>x.id===id&&x.store===curStore());if(!o)return;
  const p=prod(o.productId),shop=mode()==="shop",sd=side(),st=store();
  if(shop&&!S.seen.includes(id))S.seen.push(id);
  if(sheetTab==="mesajlar"&&o.unread)o.unread[sd]=0;
  save();refreshChrome();
  const pl=PLACES[o.design.place],cur=FLOW.indexOf(o.status),hist=Object.fromEntries(o.history),showPrice=me.role!=="ws",other=sd==="store"?st.ws:st.name;
  const unread=unreadOf(o),msgN=o.messages.filter(m=>!m.sys).length,acts=[];
  if(shop&&o.status!=="teslim")acts.push(`<button class="btn primary" type="button" id="adv" ${o.hold?"disabled":""}>${o.status==="hazir"?"Teslim edildi":STATUS[FLOW[cur+1]].t} ${ic("arrow",15)}</button>`);
  if(shop&&!o.hold&&o.status!=="teslim")acts.push(`<button class="btn danger" type="button" id="rep">${ic("warn",15)}Sorun bildir</button>`);
  if(!shop)acts.push(`<button class="btn" type="button" id="again">${ic("repeat",15)}Tekrar sipariş</button>`);
  const head=sheetTop(shop?"İş emri · "+esc(st.ws):"Sipariş · "+esc(st.name),`<span class="mono">${o.id}</span> · ${esc(o.customer)}`,`${stBadge(o.status)}${holdBadge(o)}<span class="t3 sm">Teslim ${fmtDate(o.due)} · ${total(o.qty)} adet</span>`,acts.join(""))+
    `<div class="tabs" id="tabs"><button type="button" data-t="detay" class="${sheetTab==="detay"?"on":""}">Detay</button><button type="button" data-t="mesajlar" class="${sheetTab==="mesajlar"?"on":""}">Mesajlar ${unread?`<span class="cnt hot">${unread}</span>`:msgN?`<span class="cnt">${msgN}</span>`:""}</button><button type="button" data-t="surec" class="${sheetTab==="surec"?"on":""}">Süreç</button></div>`;
  const issue=o.hold?`<div class="reason-box"><div style="display:flex;gap:10px">${ic("warn",18)}<div><h3>${esc(st.ws)} sorun bildirdi: ${esc(o.hold.reason)}</h3><div class="t2 sm" style="margin-top:2px">${esc(o.hold.by)} · ${o.hold.at} · İş, sorun çözülene kadar beklemede.</div></div></div>
    ${sd==="store"?`<div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn s" for="refile">${ic("upload",14)}Yeni dosya yükle</label><input id="refile" type="file" accept="image/*" hidden>${sheetTab!=="mesajlar"?`<button class="btn s" type="button" id="gomsg">${ic("msg",14)}Cevap yaz</button>`:""}<button class="btn primary s" type="button" id="resolve">${ic("check",14)}Sorun çözüldü</button></div>`:`<div class="t2 sm">${esc(st.name)} cevap verince Mesajlar sekmesinde görürsünüz.</div>`}</div>`:"";
  let body="";
  if(sheetTab==="detay") body=`${issue}<div id="repbox"></div><div class="stack">
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><div class="stage"><span class="tag">ÖN</span>${garment(p,o.design,"on",{guide:pl.side==="on"})}</div><div class="stage"><span class="tag">ARKA</span>${garment(p,o.design,"arka",{guide:pl.side==="arka"})}</div></div>
    <div><div class="sec-t">Baskı</div><dl class="kv"><dt>Tür</dt><dd>${KINDS[o.design.kind]}${o.design.kind==="yazi"?` · “${esc(o.design.text)}”`:""}</dd><dt>Konum</dt><dd>${pl.t} · ${o.design.cm} cm genişlik</dd><dt>Teknik</dt><dd>${esc(o.design.tech)}</dd><dt>Renk</dt><dd class="mono"><span class="sw" style="background:${o.design.ink}"></span> ${o.design.ink.toUpperCase()}</dd>${o.design.fileName?`<dt>Dosya</dt><dd class="mono" style="display:flex;gap:6px;justify-content:flex-end;align-items:center">${ic("clip",14)}${esc(o.design.fileName)}</dd>`:""}</dl></div>
    ${o.note?`<div class="alert amber">${ic("info")}<span><b>Atölyeye not:</b> ${esc(o.note)}</span></div>`:""}
    <div class="divider"></div>
    <div><div class="sec-t">Sipariş</div><dl class="kv"><dt>Müşteri</dt><dd>${esc(o.customer)}</dd>${o.phone&&showPrice?`<dt>Telefon</dt><dd class="mono">${esc(o.phone)}</dd>`:""}<dt>Ürün</dt><dd><span class="sw" style="background:${p.hex}"></span> ${esc(p.name)} · ${esc(p.color)}</dd><dt>Beden / adet</dt><dd class="mono">${qtyText(o.qty)} = ${total(o.qty)}</dd><dt>Sipariş tarihi</dt><dd>${fmtDate(o.created)}</dd><dt>Teslim</dt><dd>${fmtDate(o.due)}</dd>${showPrice?`<dt>Tutar</dt><dd class="mono">${fmtTL(total(o.qty)*p.price)}</dd>`:""}</dl></div></div>`;
  else if(sheetTab==="mesajlar") body=`${issue}<div class="thread">${o.messages.length?o.messages.map(m=>m.sys?`<div class="sysmsg">${ic("info",14)}${esc(m.text)} · ${m.at}</div>`:`<div class="msg ${m.side===sd?"mine":""} ${m.issue?"issue":""}"><span class="av">${esc(initials(m.name))}</span><div class="bub"><div class="mh"><b>${esc(m.name)}</b><span>${m.side==="ws"?esc(st.ws):esc(st.name)} · ${m.at}</span>${m.issue?bd("Sorun bildirimi","red"):""}</div><div class="tx">${esc(m.text)}</div></div></div>`).join(""):`<div class="empty">${ic("msg",20)}Henüz mesaj yok. Soru veya değişiklik için ${esc(other)}'ye buradan yazın; yazışma siparişle birlikte saklanır.</div>`}</div>
    <form class="composer" id="mf"><textarea id="mt" placeholder="${esc(other)}'ye mesaj yazın" aria-label="Mesaj"></textarea><div class="bar"><span class="hint">Ctrl + Enter ile gönder</span><button class="btn primary s" type="submit">${ic("send",14)}Gönder</button></div></form>`;
  else body=`<div class="timeline">${FLOW.map((s,i)=>{const done=i<cur||o.status==="teslim";return `<div class="tl ${done?"done":i===cur?"cur":""}"><div class="d">${done?ic("check",12,3):""}</div><div><b>${STATUS[s].t}</b><small>${hist[s]||"Bekliyor"}</small></div></div>`}).join("")}</div>`;
  sheet(o.id+" detayı",head,body);
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{sheetTab=b.dataset.t;openOrder(id)});
  const reopen=()=>{render();openOrder(id)};
  const mf=$("#mf");if(mf){mf.onsubmit=e=>{e.preventDefault();const t=$("#mt").value.trim();if(!t)return;postMsg(o,t);save();reopen();toast("send",`Mesaj ${esc(other)}'ye iletildi`)};$("#mt").onkeydown=e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))mf.requestSubmit()};const sb=$("#sheet-b");sb.scrollTop=sb.scrollHeight}
  const a=$("#adv");if(a)a.onclick=()=>advance(id);
  const ag=$("#again");if(ag)ag.onclick=()=>repeatOrder(id);
  const gm=$("#gomsg");if(gm)gm.onclick=()=>{sheetTab="mesajlar";openOrder(id);const t=$("#mt");if(t)t.focus()};
  const rp=$("#rep");if(rp)rp.onclick=()=>{
    if(sheetTab!=="detay"){sheetTab="detay";openOrder(id);const r2=$("#rep");if(r2)r2.click();return}
    let reason=ISSUES[0];
    $("#repbox").innerHTML=`<div class="reason-box"><h3>Sorun bildir</h3><div class="opts" id="rs">${ISSUES.map((r,i)=>`<button type="button" class="opt ${i===0?"on":""}" data-v="${i}">${r}</button>`).join("")}</div>
      <textarea class="input" id="rt" placeholder="Kısaca açıklayın. Örn. logo 72 dpi, baskıda bulanık çıkar."></textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" id="rsend">${esc(st.name)}'ya bildir, işi beklet</button><button class="btn" type="button" id="rcancel">Vazgeç</button></div></div>`;
    $("#sheet-b").scrollTop=0;
    $("#rs").querySelectorAll("button").forEach(b=>b.onclick=()=>{reason=ISSUES[+b.dataset.v];$("#rs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
    $("#rcancel").onclick=()=>{$("#repbox").innerHTML=""};
    $("#rsend").onclick=()=>{const t=$("#rt").value.trim()||reason;o.hold={reason,by:me.name,at:nowStamp()};postMsg(o,t,{issue:true});save();reopen();toast("warn",`Sorun ${esc(st.name)}'ya bildirildi · <b class="mono">${id}</b> beklemede`)};
  };
  const rs=$("#resolve");if(rs)rs.onclick=()=>{const ta=$("#mt"),t=ta?ta.value.trim():"";o.hold=null;postMsg(o,t?("Sorun çözüldü: "+t):"Sorun çözüldü, işe devam edebilirsiniz.");save();reopen();toast("check",`<b class="mono">${id}</b> ${esc(st.ws)}'de yeniden açıldı`)};
  const rf=$("#refile");if(rf)rf.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{o.design.file=r.result;o.design.fileName=f.name;o.messages.push({sys:true,text:`Yeni dosya yüklendi: ${f.name}`,at:nowStamp()});o.unread.ws++;save();reopen();toast("clip","Yeni dosya siparişe eklendi")};r.readAsDataURL(f)};
}

// ================= Kullanıcılar =================
function viewUsers(v){
  const rank={admin:0,store:1,ws:2},list=S.users.slice().sort((a,b)=>rank[a.role]-rank[b.role]||String(a.store).localeCompare(String(b.store)));
  v.innerHTML=ph("Kullanıcılar","Her çalışan kendi kullanıcı adıyla girer ve yalnızca bağlı olduğu şubeyi görür.")+`
  <div class="alert blue" style="margin-bottom:16px">${ic("info")}<span><b>Erişim kuralları.</b> Mağaza personeli kendi şubesinin stok, sipariş ve atölye durumunu görür. Atölye ustası yalnızca kendi atölyesinin iş emirlerini görür; fiyat ve stok göremez. Yönetici iki şubeyi de görür.</span></div>
  <div class="g2">
    <div class="card"><div class="card-h"><h2>Hesaplar <span class="sub">· ${S.users.length}</span></h2></div>
      <div class="tw"><table class="cards list"><thead><tr><th>Ad</th><th>Kullanıcı adı</th><th>Rol</th><th>Erişim</th><th></th></tr></thead><tbody>
      ${list.map(u=>`<tr><td class="a1"><div style="display:flex;gap:10px;align-items:center"><span class="av">${esc(initials(u.name))}</span><span class="strong">${esc(u.name)}</span></div></td>
        <td class="mono c-full" data-l="Kullanıcı adı">${esc(u.u)}</td><td class="c-full" data-l="Rol">${bd(ROLES[u.role],u.role==="admin"?"brand":u.role==="store"?"blue":"green")}</td><td class="c-full" data-l="Erişim">${esc(where(u))}</td>
        <td class="ta-r a2">${u.u===me.u?`<span class="t3 sm">Siz</span>`:`<button class="btn ghost s" type="button" data-del="${esc(u.u)}" aria-label="${esc(u.name)} sil">${ic("trash",14)}</button>`}</td></tr>`).join("")}
      </tbody></table></div></div>
    <div class="card"><div class="card-h"><h2>Yeni kullanıcı</h2></div>
      <form class="card-b stack" id="uf" autocomplete="off">
        <div class="field"><label for="un">Ad soyad</label><input class="input" id="un" placeholder="Örn. Zeynep Arslan"></div>
        <div class="row2"><div class="field"><label for="uu">Kullanıcı adı</label><input class="input mono" id="uu" autocapitalize="none" spellcheck="false" placeholder="zeynep"></div>
          <div class="field"><label for="upw">Geçici şifre</label><input class="input mono" id="upw" placeholder="En az 4 karakter"></div></div>
        <div class="field"><span class="lbl">Rol</span><div class="seg" id="urole"><button type="button" data-v="store" class="on">Mağaza</button><button type="button" data-v="ws">Atölye</button><button type="button" data-v="admin">Yönetici</button></div></div>
        <div class="field" id="usf"><label for="ust">Bağlı olduğu yer</label><select class="input" id="ust"></select></div>
        <div id="uerr"></div><button class="btn primary" type="submit">${ic("plus",15)}Kullanıcıyı ekle</button></form></div>
  </div>`;
  let role="store";
  const sync=()=>{$("#usf").hidden=role==="admin";$("#ust").innerHTML=S.stores.map(s=>`<option value="${s.id}">${esc(role==="ws"?s.ws:s.name)}</option>`).join("")};
  $("#urole").querySelectorAll("button").forEach(b=>b.onclick=()=>{role=b.dataset.v;$("#urole").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));sync()});sync();
  $("#uf").onsubmit=e=>{e.preventDefault();
    const name=$("#un").value.trim(),u=$("#uu").value.trim().toLocaleLowerCase("tr"),pw=$("#upw").value,err=m=>$("#uerr").innerHTML=`<div class="alert red">${ic("warn")}<span>${m}</span></div>`;
    if(!name||!u)return err("Ad ve kullanıcı adı gerekli.");
    if(!/^[a-z0-9._-]{3,20}$/.test(u))return err("Kullanıcı adı 3–20 karakter olmalı; Türkçe karakter olmadan harf, rakam, nokta veya tire kullanın.");
    if(S.users.some(x=>x.u===u))return err("Bu kullanıcı adı zaten kullanılıyor.");
    if(pw.length<4)return err("Şifre en az 4 karakter olmalı.");
    S.users.push({u,p:pw,name,role,store:role==="admin"?null:$("#ust").value});save();toast("check",`${esc(name)} eklendi · ${ROLES[role]}`);viewUsers(v)};
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Silinsin mi?";b.classList.add("danger");setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.innerHTML=ic("trash",14);b.classList.remove("danger")}},3000);return}
    const u=S.users.find(x=>x.u===b.dataset.del);S.users=S.users.filter(x=>x!==u);save();toast("trash",`${esc(u.name)} silindi`);viewUsers(v)});
}

// ================= Genel olaylar =================
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#popl .pop"))closePop();else if($("#layer").innerHTML)closeLayer();else closeSb()}
  if(e.key==="/"&&me&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){const g=$("#gs");if(g&&g.offsetParent){e.preventDefault();g.focus()}}
});
window.addEventListener("hashchange",()=>{closeAll();render()});
window.addEventListener("resize",closePop);
render();
})();
</script>
</body>
